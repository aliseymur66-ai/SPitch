name: Build SPitch Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build SPitch VST3
        run: cmake --build build --config Release --target SPitch_VST3

      - name: Package VST3 artifact
        shell: pwsh
        run: |
          $vstPath = Get-ChildItem -Path "build" -Filter "SPitch.vst3" -Directory -Recurse | Select-Object -First 1
          if (-not $vstPath) { throw "SPitch.vst3 tapilmadi!" }
          Compress-Archive -Path $vstPath.FullName -DestinationPath "SPitch-Windows-VST3.zip" -Force

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPitch-Windows-VST3
          path: SPitch-Windows-VST3.zip
