<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPitch — Studio Pitch & Mugham Engine</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: #090b0e;
      color: #e6e9ef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    .plugin-window {
      width: 100%;
      max-width: 980px;
      background: #0d0f12;
      border: 1px solid #262d3a;
      border-radius: 10px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: linear-gradient(180deg, #181d26 0%, #12161d 100%);
      border-bottom: 1px solid #242b38;
    }
    .brand h1 { margin: 0; font-size: 20px; letter-spacing: 0.5px; color: #f0f3f8; }
    .brand p { margin: 2px 0 0; font-size: 10px; letter-spacing: 1.1px; color: #8c96a8; }
    .controls-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    select, button {
      background: #0e1116;
      color: #e6e9ef;
      border: 1px solid #2d3544;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 12px;
      outline: none;
    }
    button.primary {
      background: #1d293a;
      border-color: #4da3ff;
      color: #dcebff;
      font-weight: 600;
      cursor: pointer;
    }
    button.toggle-on {
      background: #173a2a;
      border-color: #36c97e;
      color: #b7f7d4;
      font-weight: 600;
      cursor: pointer;
    }
    button.toggle-off {
      background: #2a191d;
      border-color: #c95665;
      color: #f7c7ce;
      font-weight: 600;
      cursor: pointer;
    }
    .knobs { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .knob-box { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #9aa4b5; }
    .knob-box input[type="range"] { width: 72px; accent-color: #4da3ff; cursor: pointer; }
    .knob-val { font-size: 11px; color: #e6e9ef; font-variant-numeric: tabular-nums; }

    .body-area {
      display: grid;
      grid-template-columns: 140px 1fr;
      height: 440px;
    }
    .piano-col {
      background: #11151c;
      border-right: 1px solid #242b38;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .key-row {
      position: relative;
      height: calc(100% / 24 - 1px);
      display: flex;
      align-items: center;
      border-radius: 3px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
    }
    .key-shape {
      height: 100%;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
    }
    .key-white { width: 100%; background: #c9d1dc; color: #12161d; }
    .key-black { width: 68%; background: #1a202b; color: #9aa4b5; border: 1px solid #2c3545; }
    .key-active { background: #4da3ff !important; color: #0b0e13 !important; }
    .key-comma { background: #d49b35 !important; color: #0b0e13 !important; }

    .monitor-col {
      position: relative;
      background: #0e1218;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
    }
    .readout {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: #c6d0df;
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
    }
    canvas {
      flex: 1;
      width: 100%;
      background: #121720;
      border: 1px solid #232a37;
      border-radius: 6px;
      touch-action: none;
    }
    @media (max-width: 720px) {
      .body-area { grid-template-columns: 106px 1fr; height: 400px; }
    }
  </style>
</head>
<body>
  <div class="plugin-window">
    <div class="top-bar">
      <div class="brand">
        <h1>SPitch</h1>
        <p>STUDIO PITCH & MUGHAM ENGINE</p>
      </div>

      <div class="controls-row">
        <button id="autoPitchBtn" class="toggle-on" type="button">AUTO PITCH: ON</button>

        <select id="presetSelect" title="Presetlər">
          <option value="custom">Preset: Seçilməyib</option>
          <option value="shur_vocal">Şur Xanəndə / Vokal (Re)</option>
          <option value="segah_lyrical">Segah Lirik Vokal (Mi)</option>
          <option value="rast_clean">Rast Təmiz Vokal (Do)</option>
          <option value="pop_tight">Müasir Pop Dəqiq (La Minor)</option>
          <option value="natural_soft">Təbii Əl İşi / Yumşaq</option>
        </select>

        <select id="rootSelect">
          <option value="0">C (Do)</option>
          <option value="1">C#</option>
          <option value="2" selected>D (Re)</option>
          <option value="3">D#</option>
          <option value="4">E (Mi)</option>
          <option value="5">F (Fa)</option>
          <option value="6">F#</option>
          <option value="7">G (Sol)</option>
          <option value="8">G#</option>
          <option value="9">A (Lya)</option>
          <option value="10">A#</option>
          <option value="11">B (Si)</option>
        </select>

        <select id="scaleSelect"></select>
        <button id="demoBtn" class="primary" type="button">Səs Sınağı</button>
      </div>

      <div class="knobs">
        <div class="knob-box">
          <span>CORRECTION</span>
          <input id="corrRange" type="range" min="0" max="100" value="90" />
          <span class="knob-val" id="corrVal">90%</span>
        </div>
        <div class="knob-box">
          <span>SPEED</span>
          <input id="speedRange" type="range" min="1" max="100" value="40" />
          <span class="knob-val" id="speedVal">40%</span>
        </div>
        <div class="knob-box">
          <span>VIBRATO</span>
          <input id="vibRange" type="range" min="0" max="100" value="75" />
          <span class="knob-val" id="vibVal">75%</span>
        </div>
        <div class="knob-box">
          <span>MANUAL CENT</span>
          <input id="manualCentRange" type="range" min="-100" max="100" value="0" />
          <span class="knob-val" id="manualCentVal">0c</span>
        </div>
      </div>
    </div>

    <div class="body-area">
      <div class="piano-col" id="pianoCol"></div>
      <div class="monitor-col">
        <div class="readout">
          <span id="freqInfo">INPUT: 0.0 Hz | TARGET: 0.0 Hz</span>
          <span id="modeInfo">Rejim: Avto-Pitch + Muğam: Şur</span>
        </div>
        <canvas id="pitchCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    const SCALES = [
      { name: "Major (Natural)", cents: [0, 200, 400, 500, 700, 900, 1100] },
      { name: "Major (Harmonik)", cents: [0, 200, 400, 500, 700, 800, 1100] },
      { name: "Major (Melodik)", cents: [0, 200, 400, 500, 700, 800, 1000] },
      { name: "Minor (Natural)", cents: [0, 200, 300, 500, 700, 800, 1000] },
      { name: "Minor (Harmonik)", cents: [0, 200, 300, 500, 700, 800, 1100] },
      { name: "Minor (Melodik)", cents: [0, 200, 300, 500, 700, 900, 1100] },
      { name: "Muğam: Rast", cents: [0, 200, 365, 500, 700, 900, 1065] },
      { name: "Muğam: Şur", cents: [0, 155, 300, 500, 700, 855, 1000] },
      { name: "Muğam: Segah", cents: [0, 145, 345, 500, 645, 845, 1000] },
      { name: "Muğam: Çahargah", cents: [0, 135, 400, 500, 700, 835, 1100] },
      { name: "Muğam: Bayatı-Şiraz", cents: [0, 200, 300, 500, 700, 800, 1065] },
      { name: "Muğam: Şüştər", cents: [0, 145, 300, 445, 700, 800, 1000] },
      { name: "Muğam: Humayun", cents: [0, 145, 400, 500, 645, 800, 1000] }
    ];

    const PRESETS = {
      shur_vocal: { autoPitch: true, root: 2, scale: 7, corr: 85, speed: 45, vib: 85, cent: 0 },
      segah_lyrical: { autoPitch: true, root: 4, scale: 8, corr: 80, speed: 35, vib: 90, cent: 0 },
      rast_clean: { autoPitch: true, root: 0, scale: 6, corr: 88, speed: 50, vib: 80, cent: 0 },
      pop_tight: { autoPitch: true, root: 9, scale: 3, corr: 96, speed: 80, vib: 45, cent: 0 },
      natural_soft: { autoPitch: false, root: 2, scale: 7, corr: 50, speed: 25, vib: 95, cent: 0 }
    };

    const scaleSelect = document.getElementById("scaleSelect");
    const rootSelect = document.getElementById("rootSelect");
    const presetSelect = document.getElementById("presetSelect");
    const autoPitchBtn = document.getElementById("autoPitchBtn");
    const pianoCol = document.getElementById("pianoCol");
    const canvas = document.getElementById("pitchCanvas");
    const ctx = canvas.getContext("2d");

    SCALES.forEach((s, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = s.name;
      if (idx === 7) opt.selected = true;
      scaleSelect.appendChild(opt);
    });

    let audioCtx = null;
    let autoPitchEnabled = true;
    let activeHz = 0;
    let targetHz = 0;
    let history = [];
    let manualPoints = [];
    let isDraggingCanvas = false;

    function updateAutoButton() {
      if (autoPitchEnabled) {
        autoPitchBtn.textContent = "AUTO PITCH: ON";
        autoPitchBtn.className = "toggle-on";
      } else {
        autoPitchBtn.textContent = "AUTO PITCH: OFF";
        autoPitchBtn.className = "toggle-off";
      }
      updateReadout();
    }

    function updateReadout() {
      const scaleName = SCALES[parseInt(scaleSelect.value, 10)].name;
      const modeText = autoPitchEnabled ? "Avto-Pitch" : "Əllə Nəzarət";
      document.getElementById("modeInfo").textContent = `Rejim: ${modeText} | ${scaleName}`;
      document.getElementById("freqInfo").textContent =
        `INPUT: ${activeHz.toFixed(1)} Hz  |  TARGET: ${targetHz.toFixed(1)} Hz`;
    }

    function playTone(freq, duration = 0.35) {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.14, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0008, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration + 0.02);
    }

    function computeTargetFreq(inputFreq) {
      const manualCent = parseInt(document.getElementById("manualCentRange").value, 10);
      const manualFactor = Math.pow(2, manualCent / 1200);

      if (!autoPitchEnabled) {
        return inputFreq * manualFactor;
      }

      const rootMidi = 60 + parseInt(rootSelect.value, 10);
      const scale = SCALES[parseInt(scaleSelect.value, 10)];
      const corr = parseInt(document.getElementById("corrRange").value, 10) / 100;
      const exactMidi = 69 + 12 * Math.log2(inputFreq / 440);
      const centsFromRoot = (exactMidi - rootMidi) * 100;
      const octShift = Math.floor(centsFromRoot / 1200) * 1200;
      const inOct = centsFromRoot - octShift;

      let closest = scale.cents[0];
      let minDiff = 9999;
      for (const c of scale.cents) {
        const d = Math.abs(inOct - c);
        if (d < minDiff) { minDiff = d; closest = c; }
      }
      if (Math.abs(inOct - 1200) < minDiff) closest = 1200;

      const targetMidi = rootMidi + (octShift + closest) / 100;
      const snappedFreq = 440 * Math.pow(2, (targetMidi - 69) / 12);
      const ratio = 1 + (snappedFreq / inputFreq - 1) * corr;
      return inputFreq * ratio * manualFactor;
    }

    function renderPiano() {
      pianoCol.innerHTML = "";
      const root = parseInt(rootSelect.value, 10);
      const scale = SCALES[parseInt(scaleSelect.value, 10)];
      const numKeys = 24;

      for (let i = 0; i < numKeys; i++) {
        const noteIdx = numKeys - 1 - i;
        const midi = 60 + noteIdx;
        const pitchClass = noteIdx % 12;
        const isBlack = [1, 3, 6, 8, 10].includes(pitchClass);
        const relSemi = (pitchClass - root + 12) % 12;

        let inScale = false;
        let microCent = 0;
        for (const c of scale.cents) {
          const nearestSemi = Math.round(c / 100) % 12;
          if (nearestSemi === relSemi) {
            inScale = true;
            microCent = Math.round(c - Math.round(c / 100) * 100);
            break;
          }
        }

        const row = document.createElement("div");
        row.className = "key-row";

        const shape = document.createElement("div");
        shape.className = "key-shape " + (isBlack ? "key-black" : "key-white");
        if (inScale) {
          shape.classList.add(Math.abs(microCent) > 5 ? "key-comma" : "key-active");
        }

        const freq = 440 * Math.pow(2, (midi + microCent / 100 - 69) / 12);
        shape.innerHTML = `<span>${["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"][pitchClass]}</span><span>${inScale && Math.abs(microCent) > 5 ? microCent + "c" : ""}</span>`;
        shape.addEventListener("pointerdown", () => {
          activeHz = freq;
          targetHz = computeTargetFreq(freq);
          playTone(targetHz, 0.4);
          updateReadout();
        });

        row.appendChild(shape);
        pianoCol.appendChild(row);
      }
      updateReadout();
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }

    function addManualPointFromPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
      const y = Math.max(8, Math.min(rect.height - 8, e.clientY - rect.top));
      const normY = 1 - y / rect.height;
      const midi = 58 + normY * 28;
      const freq = 440 * Math.pow(2, (midi - 69) / 12);
      activeHz = freq;
      targetHz = computeTargetFreq(freq);
      manualPoints.push({ x, y });
      if (manualPoints.length > 60) manualPoints.shift();
      playTone(targetHz, 0.25);
      updateReadout();
    }

    canvas.addEventListener("pointerdown", (e) => {
      isDraggingCanvas = true;
      addManualPointFromPointer(e);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (isDraggingCanvas) addManualPointFromPointer(e);
    });
    window.addEventListener("pointerup", () => { isDraggingCanvas = false; });

    function drawLoop() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      ctx.strokeStyle = "#1c222e";
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 36) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y < h; y += 28) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      if (activeHz > 0) {
        const tarMidi = 69 + 12 * Math.log2(targetHz / 440);
        const yTar = Math.max(10, Math.min(h - 10, h - ((tarMidi - 58) / 28) * h));
        history.push(yTar);
        if (history.length > 140) history.shift();
      }

      if (history.length > 1) {
        ctx.strokeStyle = "#4da3ff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        history.forEach((yVal, idx) => {
          const x = (idx / 139) * w;
          if (idx === 0) ctx.moveTo(x, yVal);
          else ctx.lineTo(x, yVal);
        });
        ctx.stroke();
      }

      manualPoints.forEach((pt) => {
        ctx.fillStyle = "#d49b35";
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 4.5, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(drawLoop);
    }

    autoPitchBtn.addEventListener("click", () => {
      autoPitchEnabled = !autoPitchEnabled;
      presetSelect.value = "custom";
      if (activeHz > 0) targetHz = computeTargetFreq(activeHz);
      updateAutoButton();
    });

    presetSelect.addEventListener("change", (e) => {
      const p = PRESETS[e.target.value];
      if (!p) return;
      autoPitchEnabled = p.autoPitch;
      rootSelect.value = String(p.root);
      scaleSelect.value = String(p.scale);
      document.getElementById("corrRange").value = String(p.corr);
      document.getElementById("speedRange").value = String(p.speed);
      document.getElementById("vibRange").value = String(p.vib);
      document.getElementById("manualCentRange").value = String(p.cent);
      document.getElementById("corrVal").textContent = p.corr + "%";
      document.getElementById("speedVal").textContent = p.speed + "%";
      document.getElementById("vibVal").textContent = p.vib + "%";
      document.getElementById("manualCentVal").textContent = p.cent + "c";
      updateAutoButton();
      renderPiano();
      if (activeHz > 0) {
        targetHz = computeTargetFreq(activeHz);
        updateReadout();
      }
    });

    document.getElementById("corrRange").addEventListener("input", e => {
      document.getElementById("corrVal").textContent = e.target.value + "%";
      if (activeHz > 0) { targetHz = computeTargetFreq(activeHz); updateReadout(); }
    });
    document.getElementById("speedRange").addEventListener("input", e => {
      document.getElementById("speedVal").textContent = e.target.value + "%";
    });
    document.getElementById("vibRange").addEventListener("input", e => {
      document.getElementById("vibVal").textContent = e.target.value + "%";
    });
    document.getElementById("manualCentRange").addEventListener("input", e => {
      document.getElementById("manualCentVal").textContent = e.target.value + "c";
      if (activeHz > 0) { targetHz = computeTargetFreq(activeHz); updateReadout(); }
    });

    rootSelect.addEventListener("change", () => { renderPiano(); if (activeHz > 0) { targetHz = computeTargetFreq(activeHz); updateReadout(); } });
    scaleSelect.addEventListener("change", () => { renderPiano(); if (activeHz > 0) { targetHz = computeTargetFreq(activeHz); updateReadout(); } });

    document.getElementById("demoBtn").addEventListener("click", () => {
      const rootMidi = 60 + parseInt(rootSelect.value, 10);
      const scale = SCALES[parseInt(scaleSelect.value, 10)];
      scale.cents.forEach((c, idx) => {
        setTimeout(() => {
          const f = 440 * Math.pow(2, (rootMidi + c / 100 - 69) / 12);
          activeHz = f * 1.03;
          targetHz = computeTargetFreq(activeHz);
          playTone(targetHz, 0.28);
          updateReadout();
        }, idx * 240);
      });
    });

    window.addEventListener("resize", resizeCanvas);
    updateAutoButton();
    renderPiano();
    resizeCanvas();
    drawLoop();
  </script>
</body>
</html>
