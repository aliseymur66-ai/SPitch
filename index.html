<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SPitch — Pro Vocal & Mugham Pitch Engine</title>
  <style>
    :root {
      --bg-void: #05080d;
      --bg-panel: #090e16;
      --bg-surface: #111926;
      --bg-hover: #182334;
      --border: #1e2a3d;
      --border-soft: #162030;
      --cyan: #38d6ff;
      --cyan-hi: #a5f3fc;
      --cyan-glow: rgba(56, 214, 255, 0.28);
      --gold: #f59e0b;
      --gold-hi: #fde68a;
      --emerald: #10b981;
      --text: #f1f5f9;
      --muted: #8494ad;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(56, 214, 255, 0.11), transparent 45%),
        radial-gradient(circle at 82% 25%, rgba(16, 185, 129, 0.06), transparent 45%),
        radial-gradient(circle at 70% 88%, rgba(245, 158, 11, 0.06), transparent 48%),
        var(--bg-void);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .daw-frame {
      width: 100%;
      max-width: 1200px;
      background:
        repeating-linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.01) 0px,
          rgba(255, 255, 255, 0.01) 2px,
          transparent 2px,
          transparent 6px
        ),
        linear-gradient(180deg, #101824 0%, #080c13 100%);
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow:
        0 32px 95px rgba(0, 0, 0, 0.94),
        0 0 42px rgba(56, 214, 255, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    /* Header */
    .top-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      background: linear-gradient(180deg, #151f2e 0%, #0c131d 100%);
      border-bottom: 1px solid var(--border);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-right: 6px;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      background: rgba(56, 214, 255, 0.08);
      border: 1px solid rgba(56, 214, 255, 0.35);
      box-shadow: 0 0 16px rgba(56, 214, 255, 0.18);
    }

    .brand-wordmark {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--text);
    }

    .brand-name em {
      font-style: normal;
      font-weight: 400;
      color: var(--cyan);
    }

    .brand-sub {
      font-size: 9px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    select, .ui-btn {
      background: var(--bg-panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    select:hover, .ui-btn:hover {
      background: var(--bg-hover);
      border-color: rgba(56, 214, 255, 0.45);
    }

    .ui-btn.is-on {
      background: rgba(56, 214, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan-hi);
      box-shadow: 0 0 12px rgba(56, 214, 255, 0.2);
    }

    .ui-btn.is-auto {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.7);
      color: #a7f3d0;
    }

    .ui-btn.is-gold {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.7);
      color: var(--gold-hi);
    }

    .ab-switch {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow: hidden;
      background: var(--bg-panel);
    }

    .ab-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .ab-btn.active {
      background: rgba(56, 214, 255, 0.16);
      color: var(--cyan-hi);
    }

    /* Center Workspace */
    .main-grid {
      display: grid;
      grid-template-columns: 44px 1.28fr 340px;
      min-height: 365px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #05080e 0%, #0a111b 60%, #0f1928 100%);
    }

    .layers-col {
      border-right: 1px solid var(--border);
      background: rgba(7, 11, 18, 0.9);
      padding: 7px 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
    }

    .layer-btn {
      flex: 1;
      border-radius: 6px;
      border: 1px solid var(--border-soft);
      background: #0c131f;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
    }

    .layer-btn.active {
      border-color: var(--cyan);
      background: rgba(56, 214, 255, 0.14);
      color: var(--cyan-hi);
    }

    .layer-cent {
      font-size: 8.5px;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }

    .graph-col {
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      gap: 6px;
      min-width: 0;
    }

    .hud-line {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .hud-line strong {
      color: var(--text);
    }

    .c-cyan { color: var(--cyan-hi); }
    .c-gold { color: var(--gold-hi); }
    .c-ok { color: #6ee7b7; }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
      font-size: 10.5px;
    }

    .leg-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .leg-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .canvas-box {
      position: relative;
      flex: 1;
      border-radius: 10px;
      border: 1px solid rgba(56, 214, 255, 0.18);
      background: radial-gradient(circle at 50% 50%, rgba(56, 214, 255, 0.06), rgba(5, 8, 13, 0.94) 78%);
      overflow: hidden;
    }

    .mini-piano {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 64px;
      background: rgba(7, 11, 18, 0.88);
      border-right: 1px solid rgba(56, 214, 255, 0.22);
      display: flex;
      flex-direction: column-reverse;
      padding: 3px;
      gap: 1.5px;
      z-index: 3;
    }

    .m-key {
      flex: 1;
      min-height: 0;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      font-size: 8.5px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .m-key.w {
      width: 100%;
      background: #cbd5e1;
      color: #09101a;
    }

    .m-key.b {
      width: 72%;
      background: #151f2e;
      color: #8fa3bf;
      border-color: #243247;
    }

    .m-key.scale-on {
      background: var(--cyan) !important;
      color: #041018 !important;
      box-shadow: 0 0 8px rgba(56, 214, 255, 0.45);
    }

    .m-key.comma-on {
      background: var(--gold) !important;
      color: #170f02 !important;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.45);
    }

    #rollCanvas {
      position: absolute;
      inset: 0 0 0 64px;
      width: calc(100% - 64px);
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    /* Right Hero Dials */
    .dials-col {
      border-left: 1px solid var(--border);
      background: linear-gradient(165deg, rgba(18, 29, 44, 0.78) 0%, rgba(7, 12, 20, 0.96) 100%);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      gap: 8px;
    }

    .hero-dial {
      position: relative;
      width: 138px;
      height: 138px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: ns-resize;
      touch-action: none;
    }

    .hero-dial svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 10px rgba(56, 214, 255, 0.24));
    }

    .hero-core {
      position: absolute;
      inset: 21px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, #182538, #080d15 82%);
      border: 1px solid rgba(56, 214, 255, 0.28);
      box-shadow:
        inset 0 2px 10px rgba(0, 0, 0, 0.9),
        0 8px 18px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .hero-num {
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .hero-lbl {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
    }

    .link-chip {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
    }

    .link-dot {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      border: 1px solid var(--cyan);
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    .link-dot.off {
      background: transparent;
      box-shadow: none;
    }

    /* Bottom Pro Vocal Strip */
    .pro-strip {
      padding: 10px 16px 12px;
      background: linear-gradient(180deg, #0c131d 0%, #070b12 100%);
    }

    .pro-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .mini-dial-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 68px;
    }

    .mini-dial {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, #19263a, #080d15 82%);
      border: 2px solid rgba(56, 214, 255, 0.55);
      box-shadow: 0 0 11px rgba(56, 214, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--cyan-hi);
      font-variant-numeric: tabular-nums;
      cursor: ns-resize;
      touch-action: none;
    }

    .mini-cap {
      font-size: 10px;
      color: var(--muted);
    }

    .eq-box {
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(8, 13, 21, 0.85);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 11px;
    }

    .eq-tag {
      padding: 3px 7px;
      border-radius: 5px;
      border: 1px solid rgba(56, 214, 255, 0.35);
      background: #0c1522;
      color: var(--cyan-hi);
      font-size: 10px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .eq-sliders {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 118px;
    }

    .eq-sliders input[type="range"] {
      height: 4px;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    .out-meter {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .meter-leds {
      display: flex;
      gap: 2.5px;
    }

    .led-bar {
      width: 4px;
      height: 11px;
      border-radius: 1.5px;
      background: #182436;
    }

    .led-bar.on {
      background: var(--cyan);
      box-shadow: 0 0 6px rgba(56, 214, 255, 0.65);
    }

    .led-bar.hi {
      background: var(--gold);
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.7);
    }

    .bottom-glow {
      margin-top: 10px;
      height: 2px;
      width: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(56, 214, 255, 0.35) 22%, var(--cyan-hi) 50%, rgba(56, 214, 255, 0.35) 78%, transparent 100%);
      box-shadow: 0 0 12px var(--cyan), 0 0 24px rgba(56, 214, 255, 0.55);
      border-radius: 999px;
    }

    @media (max-width: 920px) {
      .main-grid {
        grid-template-columns: 40px 1fr;
      }
      .dials-col {
        grid-column: 1 / -1;
        border-left: none;
        border-top: 1px solid var(--border);
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-around;
      }
      .hero-dial {
        width: 112px;
        height: 112px;
      }
      .hero-core {
        inset: 17px;
      }
      .hero-num {
        font-size: 16px;
      }
    }

    @media (max-width: 600px) {
      .mini-piano {
        width: 50px;
      }
      #rollCanvas {
        left: 50px;
        width: calc(100% - 50px);
      }
    }
  </style>
</head>
<body>
  <div class="daw-frame">
    <!-- Top Header -->
    <header class="top-strip">
      <div class="brand-group">
        <div class="brand-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4 13C6.5 7 9.5 7 12 13C14.5 19 17.5 19 20 13" stroke="#9ef0ff" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="13" r="2.3" fill="#f59e0b"/>
          </svg>
        </div>
        <div class="brand-wordmark">
          <span class="brand-name">S<em>Pitch</em></span>
          <span class="brand-sub">4K Vocal &amp; Mugham Engine</span>
        </div>
      </div>

      <div class="controls-row">
        <select id="presetSel" title="Presetlər"></select>

        <select id="rootSel" title="Mayə">
          <option value="0">C (Do)</option>
          <option value="1">C# / Db</option>
          <option value="2" selected>D (Re)</option>
          <option value="3">D# / Eb</option>
          <option value="4">E (Mi)</option>
          <option value="5">F (Fa)</option>
          <option value="6">F# / Gb</option>
          <option value="7">G (Sol)</option>
          <option value="8">G# / Ab</option>
          <option value="9">A (Lya)</option>
          <option value="10">A# / Bb</option>
          <option value="11">B (Si)</option>
        </select>

        <select id="scaleSel" title="Muğam və Ladlar"></select>

        <button type="button" class="ui-btn is-auto" id="autoSnapBtn">Auto Pitch: ON</button>
        <button type="button" class="ui-btn is-on" id="dragModeBtn">Sürüşdür</button>
        <button type="button" class="ui-btn" id="splitModeBtn">Kəs</button>
        <button type="button" class="ui-btn" id="resetBtn">Sıfırla</button>
        <button type="button" class="ui-btn is-on" id="testBtn">▶ 4K Səs Sınağı</button>
      </div>

      <div class="controls-row">
        <div class="ab-switch">
          <button type="button" class="ab-btn active" id="bankA">A</button>
          <button type="button" class="ab-btn" id="bankB">B</button>
        </div>
        <button type="button" class="ui-btn is-gold" id="activeBtn">Active</button>
      </div>
    </header>

    <!-- Main Workspace -->
    <section class="main-grid">
      <div class="layers-col" id="layersCol"></div>

      <div class="graph-col">
        <div class="hud-line">
          <div>
            GİRİŞ: <strong id="hudIn">0.0 Hz</strong> &nbsp;|&nbsp;
            HƏDƏF: <strong class="c-cyan" id="hudOut">0.0 Hz</strong> &nbsp;|&nbsp;
            KOMMA: <strong class="c-gold" id="hudComma">+0c</strong> &nbsp;|&nbsp;
            <strong class="c-ok" id="hudAuto">AUTO LOCK</strong>
          </div>
          <div class="legend-row">
            <span class="leg-item"><span class="leg-dot" style="background:#a5f3fc;"></span>4K Korreksiya</span>
            <span class="leg-item"><span class="leg-dot" style="background:#94a3b8;"></span>İlkin xətt</span>
            <span class="leg-item"><span class="leg-dot" style="background:#f59e0b;"></span>Muğam komma</span>
          </div>
        </div>

        <div class="canvas-box">
          <div class="mini-piano" id="miniPiano"></div>
          <canvas id="rollCanvas"></canvas>
        </div>
      </div>

      <div class="dials-col">
        <div class="hero-dial" id="pitchDial" data-min="-24" data-max="24" data-step="0.5" data-val="0">
          <svg viewBox="0 0 138 138">
            <circle cx="69" cy="69" r="57" fill="none" stroke="#182436" stroke-width="9" />
            <circle id="pitchArc" cx="69" cy="69" r="57" fill="none" stroke="url(#spGrad)" stroke-width="9"
              stroke-linecap="round" stroke-dasharray="358" stroke-dashoffset="179" transform="rotate(-90 69 69)" />
            <defs>
              <linearGradient id="spGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a5f3fc" />
                <stop offset="55%" stop-color="#38d6ff" />
                <stop offset="100%" stop-color="#f59e0b" />
              </linearGradient>
            </defs>
          </svg>
          <div class="hero-core">
            <div class="hero-num c-cyan" id="pitchNum">0.0</div>
            <div class="hero-lbl">Pitch (st)</div>
          </div>
        </div>

        <label class="link-chip" id="linkChip">
          <span class="link-dot" id="linkDot"></span>
          <span>Formant &amp; Lad Link</span>
        </label>

        <div class="hero-dial" id="formantDial" data-min="-12" data-max="12" data-step="0.5" data-val="0">
          <svg viewBox="0 0 138 138">
            <circle cx="69" cy="69" r="57" fill="none" stroke="#182436" stroke-width="9" />
            <circle id="formantArc" cx="69" cy="69" r="57" fill="none" stroke="url(#spGrad)" stroke-width="9"
              stroke-linecap="round" stroke-dasharray="358" stroke-dashoffset="179" transform="rotate(-90 69 69)" />
          </svg>
          <div class="hero-core">
            <div class="hero-num" id="formantNum">0.0</div>
            <div class="hero-lbl">Formant</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bottom 4K Vocal Strip -->
    <footer class="pro-strip">
      <div class="pro-row">
        <div class="mini-dial-wrap">
          <div class="mini-dial" id="airKnob" data-min="0" data-max="100" data-val="64">64</div>
          <span class="mini-cap">4K Air</span>
        </div>

        <div class="mini-dial-wrap">
          <div class="mini-dial" id="warmKnob" data-min="0" data-max="100" data-val="32">32</div>
          <span class="mini-cap">Warmth</span>
        </div>

        <div class="mini-dial-wrap">
          <div class="mini-dial" id="wideKnob" data-min="0" data-max="100" data-val="54">54</div>
          <span class="mini-cap">Stereo 4K</span>
        </div>

        <div class="eq-box">
          <span class="eq-tag" id="hpTag">HP 85Hz</span>
          <div class="eq-sliders">
            <input type="range" id="hpSlider" min="20" max="350" value="85" />
            <input type="range" id="lpSlider" min="2000" max="19500" value="16000" />
          </div>
          <span class="eq-tag" id="lpTag">LP 16.0k</span>
        </div>

        <div class="mini-dial-wrap">
          <div class="mini-dial" id="mixKnob" data-min="0" data-max="100" data-val="100">100</div>
          <span class="mini-cap">Mix</span>
        </div>

        <div class="mini-dial-wrap">
          <div class="mini-dial" id="gainKnob" data-min="-12" data-max="12" data-val="2.0">+2.0</div>
          <span class="mini-cap">Output</span>
        </div>

        <div class="out-meter">
          <span>Level</span>
          <div class="meter-leds" id="meterLeds"></div>
          <strong id="meterVal">-1.8</strong>
        </div>
      </div>
      <div class="bottom-glow"></div>
    </footer>
  </div>

  <script>
    const SCALES = [
      { name: "Muğam: Şur", cents: [0, 155, 300, 500, 700, 855, 1000] },
      { name: "Muğam: Segah", cents: [0, 145, 345, 500, 645, 845, 1000] },
      { name: "Muğam: Rast", cents: [0, 200, 365, 500, 700, 900, 1065] },
      { name: "Muğam: Çahargah", cents: [0, 135, 400, 500, 700, 835, 1100] },
      { name: "Muğam: Bayatı-Şiraz", cents: [0, 200, 300, 500, 700, 800, 1065] },
      { name: "Muğam: Şüştər", cents: [0, 145, 300, 445, 700, 800, 1000] },
      { name: "Muğam: Humayun", cents: [0, 145, 400, 500, 645, 800, 1000] },
      { name: "Natural Major", cents: [0, 200, 400, 500, 700, 900, 1100] },
      { name: "Harmonik Major", cents: [0, 200, 400, 500, 700, 800, 1100] },
      { name: "Natural Minor", cents: [0, 200, 300, 500, 700, 800, 1000] },
      { name: "Harmonik Minor", cents: [0, 200, 300, 500, 700, 800, 1100] }
    ];

    const PRESETS = [
      { name: "4K Şur Studiya Vokal", root: 2, scaleIdx: 0, pitch: 0, formant: 0, air: 68, warm: 34, wide: 56, mix: 100, gain: 2.0, voices: [0, 155, 300, 700, 855] },
      { name: "4K Segah Xanəndə Master", root: 4, scaleIdx: 1, pitch: 0, formant: -1.0, air: 74, warm: 40, wide: 62, mix: 100, gain: 2.5, voices: [0, 145, 345, 645, 845] },
      { name: "4K Rast Təbii Atmosfer", root: 7, scaleIdx: 2, pitch: 0, formant: 0.5, air: 62, warm: 30, wide: 58, mix: 100, gain: 1.5, voices: [0, 200, 365, 700, 1065] },
      { name: "4K Çahargah Parlaq Vokal", root: 0, scaleIdx: 3, pitch: 0, formant: 1.5, air: 82, warm: 38, wide: 66, mix: 100, gain: 2.5, voices: [0, 135, 400, 700, 835] },
      { name: "4K Bayatı-Şiraz İpək Səs", root: 9, scaleIdx: 4, pitch: 0, formant: -1.5, air: 58, warm: 44, wide: 70, mix: 95, gain: 1.0, voices: [0, 200, 300, 700, 800] },
      { name: "4K Pop Lead Double", root: 0, scaleIdx: 7, pitch: 12, formant: 3.5, air: 85, warm: 36, wide: 78, mix: 100, gain: 2.0, voices: [0, 400, 700, 1100, 1200] },
      { name: "4K Akustik Studiya Təmiz", root: 9, scaleIdx: 9, pitch: 0, formant: 0, air: 52, warm: 26, wide: 44, mix: 92, gain: 0.5, voices: [0, 200, 300, 700, 1000] }
    ];

    const presetSel = document.getElementById("presetSel");
    const rootSel = document.getElementById("rootSel");
    const scaleSel = document.getElementById("scaleSel");
    const layersCol = document.getElementById("layersCol");
    const miniPiano = document.getElementById("miniPiano");
    const canvas = document.getElementById("rollCanvas");
    const ctx = canvas.getContext("2d");
    const meterLeds = document.getElementById("meterLeds");

    let autoPitchOn = true;
    let bypassed = false;
    let linked = true;
    let activeBank = "A";
    let banks = { A: null, B: null };
    let mode = "drag"; // "drag" | "split"
    let activeLayer = 0;
    let voiceOffsets = [0, 155, 300, 700, 855];
    let segs = [{ start: 0.05, end: 0.96, cents: 0, sel: true }];
    let dragIdx = -1;
    let dragStartY = 0;
    let dragStartCents = 0;
    let cursorX = null;
    let phase = 0;
    let audioCtx = null;
    let hud = { inHz: 0, outHz: 0, comma: 0 };

    PRESETS.forEach((p, i) => {
      const o = document.createElement("option");
      o.value = i;
      o.textContent = p.name;
      presetSel.appendChild(o);
    });

    SCALES.forEach((s, i) => {
      const o = document.createElement("option");
      o.value = i;
      o.textContent = s.name;
      scaleSel.appendChild(o);
    });

    for (let i = 0; i < 16; i++) {
      const b = document.createElement("div");
      b.className = "led-bar";
      meterLeds.appendChild(b);
    }

    function setMeter(v01) {
      const n = Math.round(Math.max(0, Math.min(1, v01)) * 16);
      const bars = meterLeds.querySelectorAll(".led-bar");
      bars.forEach((el, idx) => {
        el.classList.remove("on", "hi");
        if (idx < n) el.classList.add(idx >= 13 ? "hi" : "on");
      });
      const db = v01 <= 0.002 ? -60 : (-20 + v01 * 19.5).toFixed(1);
      document.getElementById("meterVal").textContent = `${db > 0 ? "+" : ""}${db}`;
    }

    function valOf(id) {
      return parseFloat(document.getElementById(id).dataset.val || "0");
    }

    function paintDial(id, hero, signedPlus = false) {
      const el = document.getElementById(id);
      const min = parseFloat(el.dataset.min);
      const max = parseFloat(el.dataset.max);
      const step = parseFloat(el.dataset.step || "1");
      let v = parseFloat(el.dataset.val);
      v = Math.max(min, Math.min(max, Math.round(v / step) * step));
      el.dataset.val = String(v);

      const t = (v - min) / (max - min);
      const txt = step < 1
        ? (signedPlus && v > 0 ? `+${v.toFixed(1)}` : v.toFixed(1))
        : (signedPlus && v > 0 ? `+${Math.round(v)}` : String(Math.round(v)));

      if (hero) {
        const arc = document.getElementById(id === "pitchDial" ? "pitchArc" : "formantArc");
        const num = document.getElementById(id === "pitchDial" ? "pitchNum" : "formantNum");
        arc.setAttribute("stroke-dashoffset", String(358 * (1 - t * 0.85)));
        num.textContent = txt;
      } else {
        el.textContent = txt;
        el.style.boxShadow = `0 0 ${8 + t * 15}px rgba(56, 214, 255, ${(0.18 + t * 0.4).toFixed(2)})`;
      }
    }

    function bindDial(id, hero, signedPlus, cb) {
      const el = document.getElementById(id);
      let sy = 0, sv = 0;

      el.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        sy = e.clientY;
        sv = parseFloat(el.dataset.val);
        el.setPointerCapture(e.pointerId);
      });

      el.addEventListener("pointermove", (e) => {
        if (!el.hasPointerCapture(e.pointerId)) return;
        const min = parseFloat(el.dataset.min);
        const max = parseFloat(el.dataset.max);
        const nv = sv + ((sy - e.clientY) / 125) * (max - min);
        el.dataset.val = String(nv);
        paintDial(id, hero, signedPlus);

        if (id === "pitchDial" && linked) {
          const fEl = document.getElementById("formantDial");
          const fMin = parseFloat(fEl.dataset.min);
          const fMax = parseFloat(fEl.dataset.max);
          fEl.dataset.val = String(Math.max(fMin, Math.min(fMax, nv * 0.42)));
          paintDial("formantDial", true, true);
        }
        if (cb) cb();
      });
    }

    function syncDials() {
      paintDial("pitchDial", true, true);
      paintDial("formantDial", true, true);
      paintDial("airKnob", false, false);
      paintDial("warmKnob", false, false);
      paintDial("wideKnob", false, false);
      paintDial("mixKnob", false, false);
      paintDial("gainKnob", false, true);
    }

    function getDegree(pc, root, scale) {
      const rel = (pc - root + 12) % 12;
      for (const c of scale.cents) {
        const semi = Math.round(c / 100) % 12;
        if (semi === rel) {
          return { hit: true, micro: Math.round(c - Math.round(c / 100) * 100) };
        }
      }
      return { hit: false, micro: 0 };
    }

    function autoCorrectMidi(midiFloat, root, scale, strength = 0.95) {
      if (bypassed || !autoPitchOn) return midiFloat;
      const rootMidi = 60 + root;
      const centsRel = (midiFloat - rootMidi) * 100;
      const oct = Math.floor(centsRel / 1200) * 1200;
      const inOct = centsRel - oct;

      let best = scale.cents[0];
      let bestD = Infinity;
      for (const c of scale.cents) {
        const d = Math.abs(inOct - c);
        if (d < bestD) { bestD = d; best = c; }
      }
      if (Math.abs(inOct - 1200) < bestD) best = 1200;

      const targetMidi = rootMidi + (oct + best) / 100;
      return midiFloat + (targetMidi - midiFloat) * strength;
    }

    function midiToHz(m) {
      return 440 * Math.pow(2, (m - 69) / 12);
    }

    // 4K Pro Vocal Synthesizer (multi-harmonic + air + warmth + stereo)
    function trigger4KVocalSound(hz, dur = 0.36) {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();

      const now = audioCtx.currentTime;
      const airAmt = valOf("airKnob") / 100;
      const warmAmt = valOf("warmKnob") / 100;
      const wideAmt = valOf("wideKnob") / 100;
      const mixAmt = valOf("mixKnob") / 100;
      const outDb = valOf("gainKnob");
      const lpHz = parseFloat(document.getElementById("lpSlider").value);

      const masterGain = audioCtx.createGain();
      const lpFilter = audioCtx.createBiquadFilter();
      const airShelf = audioCtx.createBiquadFilter();

      lpFilter.type = "lowpass";
      lpFilter.frequency.setValueAtTime(lpHz, now);
      lpFilter.Q.setValueAtTime(1.1 + warmAmt * 3.2, now);

      airShelf.type = "highshelf";
      airShelf.frequency.setValueAtTime(6500, now);
      airShelf.gain.setValueAtTime(airAmt * 7.5, now);

      const peakAmp = Math.min(0.28, 0.16 * mixAmt * Math.pow(10, outDb / 24));
      masterGain.gain.setValueAtTime(0.0008, now);
      masterGain.gain.exponentialRampToValueAtTime(Math.max(0.003, peakAmp), now + 0.02);
      masterGain.gain.exponentialRampToValueAtTime(0.0006, now + dur);

      // Primary voice + detuned 4K double + harmonic overtone
      const voices = [
        { type: warmAmt > 0.45 ? "sawtooth" : "triangle", freq: hz, gain: 0.65 },
        { type: "sine", freq: hz * (1 + wideAmt * 0.008), gain: 0.35 + wideAmt * 0.2 },
        { type: "triangle", freq: hz * 1.5, gain: 0.08 + airAmt * 0.08 }
      ];

      voices.forEach((v) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = v.type;
        o.frequency.setValueAtTime(v.freq, now);
        g.gain.setValueAtTime(v.gain, now);
        o.connect(g);
        g.connect(lpFilter);
        o.start(now);
        o.stop(now + dur + 0.03);
      });

      lpFilter.connect(airShelf);
      airShelf.connect(masterGain);
      masterGain.connect(audioCtx.destination);

      setMeter(0.62 + mixAmt * 0.32);
      setTimeout(() => setMeter(0.06), dur * 1000);
    }

    function renderLayers() {
      layersCol.innerHTML = "";
      for (let i = 0; i < 5; i++) {
        const d = document.createElement("div");
        d.className = "layer-btn" + (i === activeLayer ? " active" : "");
        const c = voiceOffsets[i] || 0;
        d.innerHTML = `<span>${i + 1}</span><span class="layer-cent">${c > 0 ? "+" + c + "c" : "0c"}</span>`;
        d.addEventListener("click", () => {
          activeLayer = i;
          renderLayers();
          const root = parseInt(rootSel.value, 10);
          const scale = SCALES[parseInt(scaleSel.value, 10)];
          const rawM = 60 + root + (voiceOffsets[i] || 0) / 100 + 0.09; // slight off-pitch input demo
          const outM = autoCorrectMidi(rawM + valOf("pitchDial"), root, scale, 0.95);
          hud.inHz = midiToHz(rawM);
          hud.outHz = midiToHz(outM);
          hud.comma = Math.round((outM - rawM) * 100);
          updateHud();
          trigger4KVocalSound(hud.outHz, 0.34);
        });
        layersCol.appendChild(d);
      }
    }

    function renderPiano() {
      miniPiano.innerHTML = "";
      const root = parseInt(rootSel.value, 10);
      const scale = SCALES[parseInt(scaleSel.value, 10)];
      const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

      for (let off = 0; off < 24; off++) {
        const midi = 60 + off;
        const pc = midi % 12;
        const isBlack = [1, 3, 6, 8, 10].includes(pc);
        const deg = getDegree(pc, root, scale);

        const k = document.createElement("div");
        k.className = "m-key " + (isBlack ? "b" : "w");
        if (deg.hit) {
          k.classList.add(Math.abs(deg.micro) >= 10 ? "comma-on" : "scale-on");
        }
        const tag = deg.hit && Math.abs(deg.micro) >= 10
          ? `${deg.micro > 0 ? "+" : ""}${deg.micro}c`
          : "";
        k.innerHTML = `<span>${names[pc]}</span><span>${tag}</span>`;

        k.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          const rawM = midi + deg.micro / 100 + 0.08;
          const outM = autoCorrectMidi(rawM + valOf("pitchDial"), root, scale, 0.95);
          hud.inHz = midiToHz(rawM);
          hud.outHz = midiToHz(outM);
          hud.comma = deg.micro;
          updateHud();
          trigger4KVocalSound(hud.outHz, 0.35);
        });

        miniPiano.appendChild(k);
      }
    }

    function updateHud() {
      document.getElementById("hudIn").textContent = `${hud.inHz.toFixed(1)} Hz`;
      document.getElementById("hudOut").textContent = `${hud.outHz.toFixed(1)} Hz`;
      document.getElementById("hudComma").textContent = `${hud.comma > 0 ? "+" : ""}${hud.comma}c`;
      const autoEl = document.getElementById("hudAuto");
      if (bypassed) {
        autoEl.textContent = "BYPASS";
        autoEl.style.color = "#fbbf24";
      } else if (autoPitchOn) {
        autoEl.textContent = "AUTO PITCH ON";
        autoEl.style.color = "#6ee7b7";
      } else {
        autoEl.textContent = "MANUAL";
        autoEl.style.color = "#94a3b8";
      }
    }

    function getContourMidi(xn) {
      const root = parseInt(rootSel.value, 10);
      const scale = SCALES[parseInt(scaleSel.value, 10)];
      const idx = Math.min(scale.cents.length - 1, Math.floor(xn * scale.cents.length));
      // Slight natural vocal drift so Auto Pitch visibly locks onto scale degrees
      const drift = 0.14 * Math.sin(xn * Math.PI * 14);
      return 60 + root + scale.cents[idx] / 100 + drift;
    }

    function segAt(xn) {
      for (let i = 0; i < segs.length; i++) {
        if (xn >= segs[i].start && xn <= segs[i].end) return i;
      }
      return segs.length - 1;
    }

    function midiY(m, h) {
      return h - ((m - 59) / 25) * h;
    }

    function resizeCanvas() {
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(r.width * dpr));
      canvas.height = Math.max(1, Math.floor(r.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawCanvas();
    }

    function drawCanvas() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h) return;

      ctx.clearRect(0, 0, w, h);
      const root = parseInt(rootSel.value, 10);
      const scale = SCALES[parseInt(scaleSel.value, 10)];
      const pitchSt = valOf("pitchDial");
      const wide = valOf("wideKnob") / 100;

      // Grid
      ctx.strokeStyle = "rgba(56, 214, 255, 0.06)";
      ctx.lineWidth = 1;
      for (let gx = 1; gx < 12; gx++) {
        const x = (gx / 12) * w;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let gy = 1; gy < 8; gy++) {
        const y = (gy / 8) * h;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      // Luminous studio ribbons
      const ribbons = [
        { amp: 0.13 + wide * 0.08, freq: 2.3, ph: phase, col: "rgba(56, 214, 255, 0.42)", lw: 2.2 },
        { amp: 0.16 + wide * 0.09, freq: 3.2, ph: -phase * 0.85, col: "rgba(165, 243, 252, 0.34)", lw: 1.8 },
        { amp: 0.1, freq: 4.5, ph: phase * 1.25, col: "rgba(245, 158, 11, 0.25)", lw: 1.5 }
      ];

      ribbons.forEach((rb) => {
        ctx.save();
        ctx.strokeStyle = rb.col;
        ctx.lineWidth = rb.lw;
        ctx.shadowColor = rb.col;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        for (let x = 0; x <= w; x += 6) {
          const xn = x / w;
          const env = Math.sin(xn * Math.PI);
          const y = h * 0.5 + Math.sin(xn * Math.PI * 2 * rb.freq + rb.ph) * h * rb.amp * env;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();
      });

      // Raw vocal guide line
      ctx.save();
      ctx.strokeStyle = "rgba(148, 163, 184, 0.36)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let i = 0; i <= 90; i++) {
        const xn = 0.05 + (i / 90) * 0.91;
        const px = xn * w;
        const py = midiY(getContourMidi(xn), h);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();

      // Corrected pitch segments
      segs.forEach((s, idx) => {
        ctx.save();
        ctx.strokeStyle = s.sel ? "#a5f3fc" : "#38d6ff";
        ctx.lineWidth = s.sel ? 3.2 : 2.2;
        ctx.shadowColor = "#38d6ff";
        ctx.shadowBlur = s.sel ? 12 : 6;
        ctx.beginPath();

        const steps = 64;
        for (let i = 0; i <= steps; i++) {
          const xn = s.start + (i / steps) * (s.end - s.start);
          const rawM = getContourMidi(xn);
          const shifted = rawM + pitchSt + s.cents / 100;
          const outM = autoCorrectMidi(shifted, root, scale, 0.95);
          const px = xn * w;
          const py = midiY(outM, h);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        if (idx > 0) {
          const sx = s.start * w;
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "rgba(245, 158, 11, 0.72)";
          ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, h); ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.restore();
      });

      if (cursorX !== null) {
        const px = cursorX * w;
        ctx.save();
        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 2;
        ctx.shadowColor = "#f59e0b";
        ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
        ctx.restore();
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      const r = canvas.getBoundingClientRect();
      const xn = Math.max(0.02, Math.min(0.98, (e.clientX - r.left) / r.width));
      const idx = segAt(xn);
      if (idx < 0) return;
      segs.forEach((s, i) => { s.sel = i === idx; });

      if (mode === "split") {
        const cur = segs[idx];
        if (xn - cur.start > 0.05 && cur.end - xn > 0.05) {
          const rightSeg = { start: xn, end: cur.end, cents: cur.cents, sel: true };
          cur.end = xn;
          cur.sel = false;
          segs.splice(idx + 1, 0, rightSeg);
        }
        drawCanvas();
        return;
      }

      dragIdx = idx;
      dragStartY = e.clientY;
      dragStartCents = segs[idx].cents;
      canvas.setPointerCapture(e.pointerId);
      drawCanvas();
    });

    canvas.addEventListener("pointermove", (e) => {
      if (dragIdx < 0) return;
      const s = segs[dragIdx];
      s.cents = Math.max(-600, Math.min(600, Math.round((dragStartCents + (dragStartY - e.clientY) * 2) / 5) * 5));

      const root = parseInt(rootSel.value, 10);
      const scale = SCALES[parseInt(scaleSel.value, 10)];
      const mid = (s.start + s.end) * 0.5;
      const rawM = getContourMidi(mid);
      const outM = autoCorrectMidi(rawM + valOf("pitchDial") + s.cents / 100, root, scale, 0.95);
      hud.inHz = midiToHz(rawM);
      hud.outHz = midiToHz(outM);
      hud.comma = Math.round((outM - rawM) * 100);
      updateHud();
      drawCanvas();
    });

    canvas.addEventListener("pointerup", () => { dragIdx = -1; });

    function loadPreset(i) {
      const p = PRESETS[i];
      if (!p) return;
      rootSel.value = String(p.root);
      scaleSel.value = String(p.scaleIdx);
      voiceOffsets = [...p.voices];
      activeLayer = 0;

      document.getElementById("pitchDial").dataset.val = String(p.pitch);
      document.getElementById("formantDial").dataset.val = String(p.formant);
      document.getElementById("airKnob").dataset.val = String(p.air);
      document.getElementById("warmKnob").dataset.val = String(p.warm);
      document.getElementById("wideKnob").dataset.val = String(p.wide);
      document.getElementById("mixKnob").dataset.val = String(p.mix);
      document.getElementById("gainKnob").dataset.val = String(p.gain);

      syncDials();
      renderLayers();
      renderPiano();

      // Auto-pitch immediately calculates lock on load
      const root = parseInt(rootSel.value, 10);
      const scale = SCALES[parseInt(scaleSel.value, 10)];
      const rawM = getContourMidi(0.25);
      const outM = autoCorrectMidi(rawM + p.pitch, root, scale, 0.95);
      hud.inHz = midiToHz(rawM);
      hud.outHz = midiToHz(outM);
      hud.comma = Math.round((outM - rawM) * 100);
      updateHud();
      drawCanvas();
    }

    document.getElementById("autoSnapBtn").addEventListener("click", (e) => {
      autoPitchOn = !autoPitchOn;
      e.target.textContent = autoPitchOn ? "Auto Pitch: ON" : "Auto Pitch: OFF";
      e.target.classList.toggle("is-auto", autoPitchOn);
      loadPreset(parseInt(presetSel.value, 10));
    });

    document.getElementById("dragModeBtn").addEventListener("click", () => {
      mode = "drag";
      document.getElementById("dragModeBtn").classList.add("is-on");
      document.getElementById("splitModeBtn").classList.remove("is-on");
    });

    document.getElementById("splitModeBtn").addEventListener("click", () => {
      mode = "split";
      document.getElementById("splitModeBtn").classList.add("is-on");
      document.getElementById("dragModeBtn").classList.remove("is-on");
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      segs = [{ start: 0.05, end: 0.96, cents: 0, sel: true }];
      document.getElementById("pitchDial").dataset.val = "0";
      document.getElementById("formantDial").dataset.val = "0";
      syncDials();
      drawCanvas();
    });

    document.getElementById("testBtn").addEventListener("click", () => {
      const root = parseInt(rootSel.value, 10);
      const scale = SCALES[parseInt(scaleSel.value, 10)];
      const pitchSt = valOf("pitchDial");
      const steps = 10;

      for (let i = 0; i < steps; i++) {
        setTimeout(() => {
          const xn = 0.05 + (i / (steps - 1)) * 0.91;
          cursorX = xn;
          const s = segs[segAt(xn)] || segs[0];
          const rawM = getContourMidi(xn);
          const outM = autoCorrectMidi(rawM + pitchSt + s.cents / 100, root, scale, 0.95);
          hud.inHz = midiToHz(rawM);
          hud.outHz = midiToHz(outM);
          hud.comma = Math.round((outM - rawM) * 100);
          updateHud();
          trigger4KVocalSound(hud.outHz, 0.24);
          drawCanvas();

          if (i === steps - 1) {
            setTimeout(() => { cursorX = null; drawCanvas(); }, 260);
          }
        }, i * 215);
      }
    });

    document.getElementById("linkChip").addEventListener("click", () => {
      linked = !linked;
      document.getElementById("linkDot").classList.toggle("off", !linked);
    });

    document.getElementById("activeBtn").addEventListener("click", (e) => {
      bypassed = !bypassed;
      e.target.textContent = bypassed ? "Bypass" : "Active";
      e.target.classList.toggle("is-gold", !bypassed);
      updateHud();
      drawCanvas();
    });

    function snapBank() {
      return {
        preset: presetSel.value,
        root: rootSel.value,
        scale: scaleSel.value,
        pitch: document.getElementById("pitchDial").dataset.val,
        formant: document.getElementById("formantDial").dataset.val,
        air: document.getElementById("airKnob").dataset.val,
        warm: document.getElementById("warmKnob").dataset.val,
        wide: document.getElementById("wideKnob").dataset.val,
        mix: document.getElementById("mixKnob").dataset.val,
        gain: document.getElementById("gainKnob").dataset.val,
        segs: JSON.parse(JSON.stringify(segs))
      };
    }

    function applyBank(st) {
      if (!st) return;
      presetSel.value = st.preset;
      rootSel.value = st.root;
      scaleSel.value = st.scale;
      document.getElementById("pitchDial").dataset.val = st.pitch;
      document.getElementById("formantDial").dataset.val = st.formant;
      document.getElementById("airKnob").dataset.val = st.air;
      document.getElementById("warmKnob").dataset.val = st.warm;
      document.getElementById("wideKnob").dataset.val = st.wide;
      document.getElementById("mixKnob").dataset.val = st.mix;
      document.getElementById("gainKnob").dataset.val = st.gain;
      segs = JSON.parse(JSON.stringify(st.segs));
      syncDials();
      renderPiano();
      drawCanvas();
    }

    document.getElementById("bankA").addEventListener("click", () => {
      banks[activeBank] = snapBank();
      activeBank = "A";
      document.getElementById("bankA").classList.add("active");
      document.getElementById("bankB").classList.remove("active");
      if (banks.A) applyBank(banks.A);
    });

    document.getElementById("bankB").addEventListener("click", () => {
      banks[activeBank] = snapBank();
      activeBank = "B";
      document.getElementById("bankB").classList.add("active");
      document.getElementById("bankA").classList.remove("active");
      if (banks.B) applyBank(banks.B);
      else { presetSel.value = "1"; loadPreset(1); }
    });

    document.getElementById("hpSlider").addEventListener("input", (e) => {
      document.getElementById("hpTag").textContent = `HP ${e.target.value}Hz`;
    });

    document.getElementById("lpSlider").addEventListener("input", (e) => {
      const v = parseInt(e.target.value, 10);
      document.getElementById("lpTag").textContent = v >= 1000 ? `LP ${(v / 1000).toFixed(1)}k` : `LP ${v}Hz`;
    });

    presetSel.addEventListener("change", (e) => loadPreset(parseInt(e.target.value, 10)));
    rootSel.addEventListener("change", () => { renderPiano(); loadPreset(parseInt(presetSel.value, 10)); });
    scaleSel.addEventListener("change", () => { renderPiano(); loadPreset(parseInt(presetSel.value, 10)); });

    bindDial("pitchDial", true, true, drawCanvas);
    bindDial("formantDial", true, true, drawCanvas);
    bindDial("airKnob", false, false, drawCanvas);
    bindDial("warmKnob", false, false, drawCanvas);
    bindDial("wideKnob", false, false, drawCanvas);
    bindDial("mixKnob", false, false, drawCanvas);
    bindDial("gainKnob", false, true, drawCanvas);

    window.addEventListener("resize", resizeCanvas);

    setInterval(() => {
      phase += 0.05;
      drawCanvas();
    }, 34);

    presetSel.value = "0";
    loadPreset(0);
    resizeCanvas();
  </script>
</body>
</html>
