<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SPitch — Studio Pitch & Mugham Engine</title>
  <style>
    :root {
      --bg-void: #05080d;
      --bg-chassis: #0c121b;
      --bg-panel: #090e15;
      --bg-elevated: #121a26;
      --border-metal: #1f2b3d;
      --border-glow: rgba(56, 214, 255, 0.35);
      --cyan: #38d6ff;
      --cyan-bright: #9ef0ff;
      --cyan-dim: rgba(56, 214, 255, 0.16);
      --gold: #ffb020;
      --gold-dim: rgba(255, 176, 32, 0.18);
      --text: #eef6ff;
      --muted: #7f92ad;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 22% 28%, rgba(56, 214, 255, 0.12), transparent 45%),
        radial-gradient(circle at 78% 22%, rgba(28, 125, 196, 0.14), transparent 50%),
        radial-gradient(circle at 65% 85%, rgba(255, 176, 32, 0.06), transparent 45%),
        var(--bg-void);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .plugin-shell {
      width: 100%;
      max-width: 1180px;
      background:
        repeating-linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.012) 0px,
          rgba(255, 255, 255, 0.012) 2px,
          transparent 2px,
          transparent 6px
        ),
        linear-gradient(180deg, #111926 0%, #090e16 100%);
      border: 1px solid var(--border-metal);
      border-radius: 14px;
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.92),
        0 0 36px rgba(56, 214, 255, 0.07),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }

    /* Top Header Strip */
    .header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 14px;
      background: linear-gradient(180deg, #162030 0%, #0d141f 100%);
      border-bottom: 1px solid var(--border-metal);
    }

    .header-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 6px;
    }

    .logo-mark {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid var(--border-glow);
      background: radial-gradient(circle at 30% 25%, rgba(56, 214, 255, 0.35), rgba(10, 18, 30, 0.95));
      box-shadow: 0 0 14px rgba(56, 214, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 11px;
      color: var(--cyan-bright);
    }

    .logo-title {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.4px;
      color: var(--text);
    }

    .logo-title span {
      color: var(--cyan);
      font-weight: 600;
    }

    select, .pill-btn {
      background: var(--bg-panel);
      color: var(--text);
      border: 1px solid var(--border-metal);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    select:hover, .pill-btn:hover {
      border-color: rgba(56, 214, 255, 0.5);
      box-shadow: 0 0 10px rgba(56, 214, 255, 0.12);
    }

    .pill-btn.active {
      background: var(--cyan-dim);
      border-color: var(--cyan);
      color: var(--cyan-bright);
      box-shadow: 0 0 12px rgba(56, 214, 255, 0.22);
    }

    .pill-btn.gold-active {
      background: var(--gold-dim);
      border-color: var(--gold);
      color: #ffe299;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ab-box {
      display: flex;
      border: 1px solid var(--border-metal);
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-panel);
    }

    .ab-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .ab-btn.active {
      background: var(--cyan-dim);
      color: var(--cyan-bright);
    }

    /* Center Stage: Voices Strip + Viz Canvas + Hero Ring Knobs */
    .center-stage {
      display: grid;
      grid-template-columns: 44px 1.25fr 350px;
      min-height: 360px;
      border-bottom: 1px solid var(--border-metal);
      background: linear-gradient(135deg, #06090f 0%, #0b121c 62%, #101a29 100%);
    }

    .voices-rail {
      border-right: 1px solid var(--border-metal);
      background: rgba(8, 13, 21, 0.85);
      padding: 8px 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }

    .voice-slot {
      width: 100%;
      flex: 1;
      border-radius: 6px;
      border: 1px solid #1b2638;
      background: #0d1522;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      transition: all 0.14s ease;
    }

    .voice-slot.active {
      border-color: var(--cyan);
      background: rgba(56, 214, 255, 0.14);
      color: var(--cyan-bright);
      box-shadow: inset 0 0 12px rgba(56, 214, 255, 0.18);
    }

    .voice-cent {
      font-size: 8.5px;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }

    .viz-zone {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      min-width: 0;
    }

    .viz-hud {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
      z-index: 2;
    }

    .viz-hud strong {
      color: var(--text);
    }

    .viz-hud .cyan-txt {
      color: var(--cyan-bright);
    }

    .viz-hud .gold-txt {
      color: var(--gold);
    }

    .viz-canvas-wrap {
      position: relative;
      flex: 1;
      border-radius: 10px;
      border: 1px solid rgba(56, 214, 255, 0.16);
      background: radial-gradient(circle at 50% 50%, rgba(56, 214, 255, 0.06), rgba(5, 8, 13, 0.92) 75%);
      overflow: hidden;
    }

    .piano-overlay {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 66px;
      background: rgba(8, 13, 21, 0.86);
      backdrop-filter: blur(4px);
      border-right: 1px solid rgba(56, 214, 255, 0.22);
      display: flex;
      flex-direction: column-reverse;
      padding: 3px;
      gap: 1.5px;
      z-index: 3;
    }

    .p-key {
      flex: 1;
      min-height: 0;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      font-size: 8.5px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .p-key.white {
      width: 100%;
      background: #c7d4e6;
      color: #09101a;
    }

    .p-key.black {
      width: 72%;
      background: #162030;
      color: #8fa3bf;
      border-color: #25344b;
    }

    .p-key.in-scale {
      background: var(--cyan) !important;
      color: #041018 !important;
      box-shadow: 0 0 8px rgba(56, 214, 255, 0.45);
    }

    .p-key.in-comma {
      background: var(--gold) !important;
      color: #160e02 !important;
      box-shadow: 0 0 8px rgba(255, 176, 32, 0.45);
    }

    #mainCanvas {
      position: absolute;
      inset: 0 0 0 66px;
      width: calc(100% - 66px);
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    /* Right Hero Ring Knobs (Pitch + Formant/Mugham Comma) */
    .hero-knobs {
      border-left: 1px solid var(--border-metal);
      background: linear-gradient(160deg, rgba(20, 32, 48, 0.75) 0%, rgba(8, 13, 22, 0.95) 100%);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      gap: 10px;
    }

    .ring-dial {
      position: relative;
      width: 144px;
      height: 144px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: ns-resize;
      touch-action: none;
    }

    .ring-dial svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 10px rgba(56, 214, 255, 0.25));
    }

    .ring-center {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, #192638, #090e16 80%);
      border: 1px solid rgba(56, 214, 255, 0.28);
      box-shadow:
        inset 0 2px 10px rgba(0, 0, 0, 0.9),
        0 8px 20px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .ring-val {
      font-size: 21px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .ring-lbl {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.4px;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
    }

    .link-led {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid var(--cyan);
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    .link-led.off {
      background: transparent;
      box-shadow: none;
    }

    /* Bottom Strip: Drive, Widener, Filters, Mix, Output Gain + Glowing Line */
    .bottom-strip {
      padding: 10px 16px 12px;
      background: linear-gradient(180deg, #0d141f 0%, #080d14 100%);
      position: relative;
    }

    .bottom-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .mini-knob {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 72px;
    }

    .mini-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, #1a273b, #090e16 80%);
      border: 2px solid rgba(56, 214, 255, 0.55);
      box-shadow: 0 0 12px rgba(56, 214, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan-bright);
      font-variant-numeric: tabular-nums;
      cursor: ns-resize;
      touch-action: none;
    }

    .mini-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.4px;
    }

    .filter-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(9, 14, 22, 0.8);
      border: 1px solid var(--border-metal);
      border-radius: 8px;
      padding: 7px 12px;
    }

    .filter-badge {
      padding: 3px 8px;
      border-radius: 5px;
      border: 1px solid rgba(56, 214, 255, 0.35);
      background: #0d1624;
      color: var(--cyan-bright);
      font-size: 10.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .filter-sliders {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 130px;
    }

    .filter-sliders input[type="range"] {
      height: 4px;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    .meter-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .meter-bars {
      display: flex;
      gap: 2.5px;
      align-items: center;
    }

    .m-seg {
      width: 4px;
      height: 11px;
      border-radius: 1.5px;
      background: #1a2638;
    }

    .m-seg.lit {
      background: var(--cyan);
      box-shadow: 0 0 6px rgba(56, 214, 255, 0.65);
    }

    .m-seg.peak {
      background: var(--gold);
      box-shadow: 0 0 6px rgba(255, 176, 32, 0.7);
    }

    .neon-seam {
      margin-top: 10px;
      height: 2px;
      width: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(56, 214, 255, 0.35) 20%, var(--cyan-bright) 50%, rgba(56, 214, 255, 0.35) 80%, transparent 100%);
      box-shadow: 0 0 12px var(--cyan), 0 0 24px rgba(56, 214, 255, 0.55);
      border-radius: 999px;
    }

    @media (max-width: 920px) {
      .center-stage {
        grid-template-columns: 40px 1fr;
      }
      .hero-knobs {
        grid-column: 1 / -1;
        border-left: none;
        border-top: 1px solid var(--border-metal);
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-around;
        padding: 12px;
      }
      .ring-dial {
        width: 116px;
        height: 116px;
      }
      .ring-center {
        inset: 18px;
      }
      .ring-val {
        font-size: 17px;
      }
    }

    @media (max-width: 600px) {
      .piano-overlay {
        width: 52px;
      }
      #mainCanvas {
        left: 52px;
        width: calc(100% - 52px);
      }
    }
  </style>
</head>
<body>
  <div class="plugin-shell">
    <!-- Top Header -->
    <div class="header-bar">
      <div class="header-left">
        <div class="logo-wrap">
          <div class="logo-mark">SP</div>
          <div class="logo-title">S<span>Pitch</span></div>
        </div>

        <select id="presetSelect" title="Studia Presetləri"></select>

        <select id="rootSelect" title="Mayə / Kök Not">
          <option value="0">C (Do)</option>
          <option value="1">C# / Db</option>
          <option value="2" selected>D (Re)</option>
          <option value="3">D# / Eb</option>
          <option value="4">E (Mi)</option>
          <option value="5">F (Fa)</option>
          <option value="6">F# / Gb</option>
          <option value="7">G (Sol)</option>
          <option value="8">G# / Ab</option>
          <option value="9">A (Lya)</option>
          <option value="10">A# / Bb</option>
          <option value="11">B (Si)</option>
        </select>

        <select id="scaleSelect" title="Muğam və Ladlar"></select>

        <button type="button" class="pill-btn active" id="btnPitchMode">Ton Sürüşdür</button>
        <button type="button" class="pill-btn" id="btnCutMode">Kəs (Split)</button>
        <button type="button" class="pill-btn" id="btnReset">Sıfırla</button>
        <button type="button" class="pill-btn active" id="btnTest">▶ Səs Sınağı</button>
      </div>

      <div class="header-right">
        <div class="ab-box">
          <button type="button" class="ab-btn active" id="abA">A</button>
          <button type="button" class="ab-btn" id="abB">B</button>
        </div>
        <button type="button" class="pill-btn gold-active" id="btnBypass">Active</button>
      </div>
    </div>

    <!-- Center Stage -->
    <div class="center-stage">
      <!-- Left Voice/Layer Slots (0..4) -->
      <div class="voices-rail" id="voicesRail"></div>

      <!-- Center Pitch Curve + Wave Visualizer + Piano -->
      <div class="viz-zone">
        <div class="viz-hud">
          <div>
            GİRİŞ: <strong id="hudIn">0.0 Hz</strong> &nbsp;|&nbsp;
            HƏDƏF: <strong class="cyan-txt" id="hudTarget">0.0 Hz</strong> &nbsp;|&nbsp;
            KOMMA: <strong class="gold-txt" id="hudComma">+0c</strong>
          </div>
          <div>
            LAD: <strong class="cyan-txt" id="hudScale">Muğam: Şur</strong> &nbsp;|&nbsp;
            HİSSƏ: <strong id="hudSegs">1</strong>
          </div>
        </div>

        <div class="viz-canvas-wrap">
          <div class="piano-overlay" id="pianoOverlay"></div>
          <canvas id="mainCanvas"></canvas>
        </div>
      </div>

      <!-- Right Hero Ring Knobs -->
      <div class="hero-knobs">
        <div class="ring-dial" id="pitchDial" data-min="-24" data-max="24" data-step="0.5" data-val="0">
          <svg viewBox="0 0 144 144">
            <circle cx="72" cy="72" r="60" fill="none" stroke="#182436" stroke-width="10" />
            <circle id="pitchArc" cx="72" cy="72" r="60" fill="none" stroke="url(#cyanGrad)" stroke-width="10"
              stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="188" transform="rotate(-90 72 72)" />
            <defs>
              <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#9ef0ff" />
                <stop offset="55%" stop-color="#38d6ff" />
                <stop offset="100%" stop-color="#ffb020" />
              </linearGradient>
            </defs>
          </svg>
          <div class="ring-center">
            <div class="ring-val" id="pitchValText">0.0</div>
            <div class="ring-lbl">Pitch (st)</div>
          </div>
        </div>

        <label class="link-row" id="linkToggle">
          <span class="link-led" id="linkLed"></span>
          <span>Muğam / Formant Link</span>
        </label>

        <div class="ring-dial" id="formantDial" data-min="-12" data-max="12" data-step="0.5" data-val="0">
          <svg viewBox="0 0 144 144">
            <circle cx="72" cy="72" r="60" fill="none" stroke="#182436" stroke-width="10" />
            <circle id="formantArc" cx="72" cy="72" r="60" fill="none" stroke="url(#cyanGrad)" stroke-width="10"
              stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="188" transform="rotate(-90 72 72)" />
          </svg>
          <div class="ring-center">
            <div class="ring-val" id="formantValText">0.0</div>
            <div class="ring-lbl">Formant</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Control Strip -->
    <div class="bottom-strip">
      <div class="bottom-controls">
        <div class="mini-knob">
          <div class="mini-ring" id="driveKnob" data-min="0" data-max="100" data-val="22">22</div>
          <span class="mini-label">Drive</span>
        </div>

        <div class="mini-knob">
          <div class="mini-ring" id="widenerKnob" data-min="0" data-max="100" data-val="45">45</div>
          <span class="mini-label">Widener</span>
        </div>

        <div class="filter-cluster">
          <span class="filter-badge" id="hpBadge">HP 80Hz</span>
          <div class="filter-sliders">
            <input type="range" id="hpRange" min="20" max="400" value="80" title="High-Pass Filter" />
            <input type="range" id="lpRange" min="1500" max="18000" value="12400" title="Low-Pass Filter" />
          </div>
          <span class="filter-badge" id="lpBadge">LP 12.4k</span>
        </div>

        <div class="mini-knob">
          <div class="mini-ring" id="mixKnob" data-min="0" data-max="100" data-val="100">100</div>
          <span class="mini-label">Mix</span>
        </div>

        <div class="mini-knob">
          <div class="mini-ring" id="gainKnob" data-min="-12" data-max="12" data-val="1.5">+1.5</div>
          <span class="mini-label">Output Gain</span>
        </div>

        <div class="meter-box">
          <span>Output</span>
          <div class="meter-bars" id="meterBars"></div>
          <strong id="meterDb">-2.4</strong>
        </div>
      </div>
      <div class="neon-seam"></div>
    </div>
  </div>

  <script>
    const SCALES = [
      { name: "Muğam: Şur", cents: [0, 155, 300, 500, 700, 855, 1000] },
      { name: "Muğam: Segah", cents: [0, 145, 345, 500, 645, 845, 1000] },
      { name: "Muğam: Rast", cents: [0, 200, 365, 500, 700, 900, 1065] },
      { name: "Muğam: Çahargah", cents: [0, 135, 400, 500, 700, 835, 1100] },
      { name: "Muğam: Bayatı-Şiraz", cents: [0, 200, 300, 500, 700, 800, 1065] },
      { name: "Muğam: Şüştər", cents: [0, 145, 300, 445, 700, 800, 1000] },
      { name: "Muğam: Humayun", cents: [0, 145, 400, 500, 645, 800, 1000] },
      { name: "Natural Major", cents: [0, 200, 400, 500, 700, 900, 1100] },
      { name: "Harmonik Major", cents: [0, 200, 400, 500, 700, 800, 1100] },
      { name: "Natural Minor", cents: [0, 200, 300, 500, 700, 800, 1000] },
      { name: "Harmonik Minor", cents: [0, 200, 300, 500, 700, 800, 1100] }
    ];

    const PRESETS = [
      { name: "Şur Studiya Harmoniya", root: 2, scaleIdx: 0, pitch: 0, formant: 0, drive: 22, widener: 48, mix: 100, gain: 1.5, voiceCents: [0, 155, 300, 700, 855] },
      { name: "Segah Mikrotonal Zəngulə", root: 4, scaleIdx: 1, pitch: 2, formant: -1.5, drive: 28, widener: 60, mix: 100, gain: 2.0, voiceCents: [0, 145, 345, 645, 845] },
      { name: "Rast Klassik Kvartet", root: 7, scaleIdx: 2, pitch: 0, formant: 1.0, drive: 18, widener: 52, mix: 95, gain: 1.0, voiceCents: [0, 200, 365, 700, 1065] },
      { name: "Çahargah Kəskin Vokal", root: 0, scaleIdx: 3, pitch: 5, formant: 2.0, drive: 36, widener: 65, mix: 100, gain: 2.5, voiceCents: [0, 135, 400, 700, 835] },
      { name: "Bayatı-Şiraz Lirik Atmosfer", root: 9, scaleIdx: 4, pitch: -2, formant: -2.0, drive: 15, widener: 72, mix: 90, gain: 0.5, voiceCents: [0, 200, 300, 700, 800] },
      { name: "Modern Pop Double-Track", root: 0, scaleIdx: 7, pitch: 12, formant: 4.0, drive: 30, widener: 78, mix: 100, gain: 2.0, voiceCents: [0, 400, 700, 1100, 1200] },
      { name: "Akustik Ballada Təmiz", root: 9, scaleIdx: 9, pitch: 0, formant: 0, drive: 10, widener: 35, mix: 85, gain: 0.0, voiceCents: [0, 200, 300, 700, 1000] }
    ];

    // DOM refs
    const presetSelect = document.getElementById("presetSelect");
    const rootSelect = document.getElementById("rootSelect");
    const scaleSelect = document.getElementById("scaleSelect");
    const voicesRail = document.getElementById("voicesRail");
    const pianoOverlay = document.getElementById("pianoOverlay");
    const canvas = document.getElementById("mainCanvas");
    const ctx = canvas.getContext("2d");
    const meterBars = document.getElementById("meterBars");

    // State
    let activeSlot = 0;
    let voiceCents = [0, 155, 300, 700, 855];
    let linkedMode = true;
    let bypassed = false;
    let slotBank = "A";
    let slotStates = { A: null, B: null };
    let editMode = "pitch"; // "pitch" | "cut"
    let segments = [{ startX: 0.06, endX: 0.96, offsetCents: 0, selected: true }];
    let dragSegIdx = -1;
    let dragStartY = 0;
    let dragStartOffset = 0;
    let playheadX = null;
    let wavePhase = 0;
    let audioCtx = null;

    let hudState = { inHz: 0, targetHz: 0, commaC: 0 };

    // Init dropdowns
    PRESETS.forEach((p, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = p.name;
      presetSelect.appendChild(opt);
    });

    SCALES.forEach((s, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = s.name;
      scaleSelect.appendChild(opt);
    });

    // Init meter segments
    for (let i = 0; i < 16; i++) {
      const seg = document.createElement("div");
      seg.className = "m-seg";
      meterBars.appendChild(seg);
    }

    function setMeterLevel(level01) {
      const clamped = Math.max(0, Math.min(1, level01));
      const litCount = Math.round(clamped * 16);
      const segs = meterBars.querySelectorAll(".m-seg");
      segs.forEach((el, idx) => {
        el.classList.remove("lit", "peak");
        if (idx < litCount) {
          el.classList.add(idx >= 13 ? "peak" : "lit");
        }
      });
      const db = clamped <= 0.001 ? -60 : (-24 + clamped * 23.5).toFixed(1);
      document.getElementById("meterDb").textContent = `${db > 0 ? "+" : ""}${db}`;
    }

    function getDialValue(id) {
      return parseFloat(document.getElementById(id).dataset.val || "0");
    }

    function updateRingVisual(id, isHero, isSignedPlus = false) {
      const el = document.getElementById(id);
      const min = parseFloat(el.dataset.min);
      const max = parseFloat(el.dataset.max);
      const step = parseFloat(el.dataset.step || "1");
      let val = parseFloat(el.dataset.val);
      val = Math.max(min, Math.min(max, Math.round(val / step) * step));
      el.dataset.val = String(val);

      const ratio = (val - min) / (max - min);
      const formatted = step < 1
        ? (isSignedPlus && val > 0 ? `+${val.toFixed(1)}` : val.toFixed(1))
        : (isSignedPlus && val > 0 ? `+${Math.round(val)}` : String(Math.round(val)));

      if (isHero) {
        const arcId = id === "pitchDial" ? "pitchArc" : "formantArc";
        const textId = id === "pitchDial" ? "pitchValText" : "formantValText";
        const circ = 377;
        document.getElementById(arcId).setAttribute("stroke-dashoffset", String(circ * (1 - ratio * 0.85)));
        document.getElementById(textId).textContent = formatted;
      } else {
        el.textContent = formatted;
        const glow = 8 + ratio * 16;
        el.style.boxShadow = `0 0 ${glow}px rgba(56, 214, 255, ${(0.18 + ratio * 0.42).toFixed(2)})`;
      }
    }

    function setupDragDial(id, isHero, isSignedPlus = false, onChange = null) {
      const el = document.getElementById(id);
      let startY = 0;
      let startVal = 0;

      el.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        startY = e.clientY;
        startVal = parseFloat(el.dataset.val);
        el.setPointerCapture(e.pointerId);
      });

      el.addEventListener("pointermove", (e) => {
        if (!el.hasPointerCapture(e.pointerId)) return;
        const min = parseFloat(el.dataset.min);
        const max = parseFloat(el.dataset.max);
        const span = max - min;
        const delta = ((startY - e.clientY) / 130) * span;
        el.dataset.val = String(startVal + delta);
        updateRingVisual(id, isHero, isSignedPlus);

        if (id === "pitchDial" && linkedMode) {
          const fEl = document.getElementById("formantDial");
          const fMin = parseFloat(fEl.dataset.min);
          const fMax = parseFloat(fEl.dataset.max);
          fEl.dataset.val = String(Math.max(fMin, Math.min(fMax, (startVal + delta) * 0.45)));
          updateRingVisual("formantDial", true, true);
        }
        if (onChange) onChange();
      });
    }

    function applyPreset(idx) {
      const p = PRESETS[idx];
      if (!p) return;
      rootSelect.value = String(p.root);
      scaleSelect.value = String(p.scaleIdx);
      voiceCents = [...p.voiceCents];
      activeSlot = 0;

      document.getElementById("pitchDial").dataset.val = String(p.pitch);
      document.getElementById("formantDial").dataset.val = String(p.formant);
      document.getElementById("driveKnob").dataset.val = String(p.drive);
      document.getElementById("widenerKnob").dataset.val = String(p.widener);
      document.getElementById("mixKnob").dataset.val = String(p.mix);
      document.getElementById("gainKnob").dataset.val = String(p.gain);

      refreshAllKnobs();
      renderVoicesRail();
      renderPiano();
      updateHud();
      drawMainCanvas();
    }

    function refreshAllKnobs() {
      updateRingVisual("pitchDial", true, true);
      updateRingVisual("formantDial", true, true);
      updateRingVisual("driveKnob", false, false);
      updateRingVisual("widenerKnob", false, false);
      updateRingVisual("mixKnob", false, false);
      updateRingVisual("gainKnob", false, true);
    }

    function renderVoicesRail() {
      voicesRail.innerHTML = "";
      for (let i = 0; i < 5; i++) {
        const btn = document.createElement("div");
        btn.className = "voice-slot" + (i === activeSlot ? " active" : "");
        const c = voiceCents[i] || 0;
        btn.innerHTML = `<span>${i}</span><span class="voice-cent">${c > 0 ? "+" + c + "c" : "0c"}</span>`;
        btn.addEventListener("click", () => {
          activeSlot = i;
          renderVoicesRail();
          const root = parseInt(rootSelect.value, 10);
          const baseMidi = 60 + root + (voiceCents[i] || 0) / 100;
          const freq = 440 * Math.pow(2, (baseMidi - 69) / 12);
          playAudio(freq, 0.34);
          hudState.inHz = freq;
          hudState.targetHz = freq;
          hudState.commaC = voiceCents[i] || 0;
          updateHud();
        });
        voicesRail.appendChild(btn);
      }
    }

    function getScaleDegreeInfo(pitchClass, root, scale) {
      const rel = (pitchClass - root + 12) % 12;
      for (const c of scale.cents) {
        const semi = Math.round(c / 100) % 12;
        if (semi === rel) {
          const micro = Math.round(c - Math.round(c / 100) * 100);
          return { inScale: true, micro };
        }
      }
      return { inScale: false, micro: 0 };
    }

    function snapMidi(midiFloat, root, scale, amount = 0.9) {
      const rootMidi = 60 + root;
      const centsFromRoot = (midiFloat - rootMidi) * 100;
      const oct = Math.floor(centsFromRoot / 1200) * 1200;
      const inOct = centsFromRoot - oct;

      let best = scale.cents[0];
      let bestD = Infinity;
      for (const c of scale.cents) {
        const d = Math.abs(inOct - c);
        if (d < bestD) { bestD = d; best = c; }
      }
      if (Math.abs(inOct - 1200) < bestD) best = 1200;

      const targetMidi = rootMidi + (oct + best) / 100;
      return midiFloat + (targetMidi - midiFloat) * amount;
    }

    function renderPiano() {
      pianoOverlay.innerHTML = "";
      const root = parseInt(rootSelect.value, 10);
      const scale = SCALES[parseInt(scaleSelect.value, 10)];
      const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

      // flex-direction: column-reverse renders index 0 at bottom
      for (let offset = 0; offset < 24; offset++) {
        const midi = 60 + offset;
        const pc = midi % 12;
        const isBlack = [1, 3, 6, 8, 10].includes(pc);
        const info = getScaleDegreeInfo(pc, root, scale);

        const el = document.createElement("div");
        el.className = "p-key " + (isBlack ? "black" : "white");
        if (info.inScale) {
          el.classList.add(Math.abs(info.micro) >= 10 ? "in-comma" : "in-scale");
        }

        const tag = info.inScale && Math.abs(info.micro) >= 10
          ? `${info.micro > 0 ? "+" : ""}${info.micro}c`
          : "";
        el.innerHTML = `<span>${names[pc]}</span><span>${tag}</span>`;

        el.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          const rawM = midi + info.micro / 100;
          const pitchShift = getDialValue("pitchDial");
          const snappedM = snapMidi(rawM + pitchShift, root, scale, bypassed ? 0 : 0.92);
          const f = 440 * Math.pow(2, (snappedM - 69) / 12);
          hudState.inHz = 440 * Math.pow(2, (rawM - 69) / 12);
          hudState.targetHz = f;
          hudState.commaC = info.micro;
          updateHud();
          playAudio(f, 0.35);
        });

        pianoOverlay.appendChild(el);
      }
    }

    function playAudio(freq, dur = 0.35) {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const subOsc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      const drive = getDialValue("driveKnob") / 100;
      const widener = getDialValue("widenerKnob") / 100;
      const mix = getDialValue("mixKnob") / 100;
      const outGainDb = getDialValue("gainKnob");
      const lpFreq = parseFloat(document.getElementById("lpRange").value);

      osc.type = drive > 0.35 ? "sawtooth" : "triangle";
      osc.frequency.setValueAtTime(freq, now);

      subOsc.type = "sine";
      subOsc.frequency.setValueAtTime(freq * (1 + widener * 0.012), now);

      filter.type = "lowpass";
      filter.frequency.setValueAtTime(lpFreq, now);
      filter.Q.setValueAtTime(1.2 + drive * 4.5, now);

      const amp = Math.min(0.25, 0.14 * mix * Math.pow(10, outGainDb / 24));
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.002, amp), now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0005, now + dur);

      osc.connect(filter);
      subOsc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      subOsc.start(now);
      osc.stop(now + dur + 0.03);
      subOsc.stop(now + dur + 0.03);

      setMeterLevel(0.55 + mix * 0.35);
      setTimeout(() => setMeterLevel(0.08), dur * 1000);
    }

    function updateHud() {
      const scale = SCALES[parseInt(scaleSelect.value, 10)];
      document.getElementById("hudIn").textContent = `${hudState.inHz.toFixed(1)} Hz`;
      document.getElementById("hudTarget").textContent = `${hudState.targetHz.toFixed(1)} Hz`;
      document.getElementById("hudComma").textContent = `${hudState.commaC > 0 ? "+" : ""}${hudState.commaC}c`;
      document.getElementById("hudScale").textContent = scale.name;
      document.getElementById("hudSegs").textContent = String(segments.length);
    }

    function getMelodyMidiAt(xn) {
      const root = parseInt(rootSelect.value, 10);
      const scale = SCALES[parseInt(scaleSelect.value, 10)];
      const degIdx = Math.min(scale.cents.length - 1, Math.floor(xn * scale.cents.length));
      const baseM = 60 + root + scale.cents[degIdx] / 100;
      const ornament = 0.65 * Math.sin(xn * Math.PI * 10);
      return baseM + ornament;
    }

    function getSegAt(xn) {
      for (let i = 0; i < segments.length; i++) {
        if (xn >= segments[i].startX && xn <= segments[i].endX) return i;
      }
      return segments.length - 1;
    }

    function midiToY(m, h) {
      return h - ((m - 59) / 25) * h;
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawMainCanvas();
    }

    function drawMainCanvas() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h) return;

      ctx.clearRect(0, 0, w, h);

      const root = parseInt(rootSelect.value, 10);
      const scale = SCALES[parseInt(scaleSelect.value, 10)];
      const pitchShift = getDialValue("pitchDial");
      const formantShift = getDialValue("formantDial");
      const widener = getDialValue("widenerKnob") / 100;

      // Subtle grid
      ctx.strokeStyle = "rgba(56, 214, 255, 0.06)";
      ctx.lineWidth = 1;
      for (let gx = 1; gx < 12; gx++) {
        const x = (gx / 12) * w;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let gy = 1; gy < 8; gy++) {
        const y = (gy / 8) * h;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      // Luminous harmonic ribbons inspired by studio pitch/harmony engine
      const ribbons = [
        { amp: 0.14 + widener * 0.08, freq: 2.2, phase: wavePhase, color: "rgba(56, 214, 255, 0.42)", lw: 2.2 },
        { amp: 0.17 + widener * 0.1, freq: 3.1, phase: -wavePhase * 0.85, color: "rgba(158, 240, 255, 0.34)", lw: 1.8 },
        { amp: 0.11 + Math.abs(formantShift) * 0.008, freq: 4.4, phase: wavePhase * 1.3, color: "rgba(255, 176, 32, 0.28)", lw: 1.6 }
      ];

      ribbons.forEach((rb) => {
        ctx.save();
        ctx.strokeStyle = rb.color;
        ctx.lineWidth = rb.lw;
        ctx.shadowColor = rb.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        for (let x = 0; x <= w; x += 6) {
          const xn = x / w;
          const env = Math.sin(xn * Math.PI);
          const y = h * 0.5 + Math.sin(xn * Math.PI * 2 * rb.freq + rb.phase) * h * rb.amp * env;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();
      });

      // Editable pitch curve segments
      segments.forEach((seg, idx) => {
        ctx.save();
        ctx.strokeStyle = seg.selected ? "#9ef0ff" : "#38d6ff";
        ctx.lineWidth = seg.selected ? 3.2 : 2.2;
        ctx.shadowColor = "#38d6ff";
        ctx.shadowBlur = seg.selected ? 12 : 6;
        ctx.beginPath();

        const steps = 60;
        for (let s = 0; s <= steps; s++) {
          const xn = seg.startX + (s / steps) * (seg.endX - seg.startX);
          const rawM = getMelodyMidiAt(xn);
          const shifted = rawM + pitchShift + seg.offsetCents / 100;
          const finalM = bypassed ? rawM : snapMidi(shifted, root, scale, 0.9);
          const px = xn * w;
          const py = midiToY(finalM, h);
          if (s === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        if (idx > 0) {
          const sx = seg.startX * w;
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "rgba(255, 176, 32, 0.7)";
          ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, h); ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.restore();
      });

      if (playheadX !== null) {
        const px = playheadX * w;
        ctx.save();
        ctx.strokeStyle = "#ffb020";
        ctx.lineWidth = 2;
        ctx.shadowColor = "#ffb020";
        ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
        ctx.restore();
      }
    }

    // Canvas interaction
    canvas.addEventListener("pointerdown", (e) => {
      const rect = canvas.getBoundingClientRect();
      const xn = Math.max(0.02, Math.min(0.98, (e.clientX - rect.left) / rect.width));
      const idx = getSegAt(xn);
      if (idx < 0) return;
      segments.forEach((s, i) => { s.selected = i === idx; });

      if (editMode === "cut") {
        const cur = segments[idx];
        if (xn - cur.startX > 0.05 && cur.endX - xn > 0.05) {
          const right = { startX: xn, endX: cur.endX, offsetCents: cur.offsetCents, selected: true };
          cur.endX = xn;
          cur.selected = false;
          segments.splice(idx + 1, 0, right);
        }
        updateHud();
        drawMainCanvas();
        return;
      }

      dragSegIdx = idx;
      dragStartY = e.clientY;
      dragStartOffset = segments[idx].offsetCents;
      canvas.setPointerCapture(e.pointerId);
      updateHud();
      drawMainCanvas();
    });

    canvas.addEventListener("pointermove", (e) => {
      if (dragSegIdx < 0) return;
      const seg = segments[dragSegIdx];
      const dy = dragStartY - e.clientY;
      seg.offsetCents = Math.max(-600, Math.min(600, Math.round((dragStartOffset + dy * 2) / 5) * 5));

      const root = parseInt(rootSelect.value, 10);
      const scale = SCALES[parseInt(scaleSelect.value, 10)];
      const midX = (seg.startX + seg.endX) * 0.5;
      const rawM = getMelodyMidiAt(midX);
      const finalM = snapMidi(rawM + getDialValue("pitchDial") + seg.offsetCents / 100, root, scale, 0.9);
      hudState.inHz = 440 * Math.pow(2, (rawM - 69) / 12);
      hudState.targetHz = 440 * Math.pow(2, (finalM - 69) / 12);
      hudState.commaC = Math.round((finalM - rawM) * 100);
      updateHud();
      drawMainCanvas();
    });

    canvas.addEventListener("pointerup", () => {
      dragSegIdx = -1;
    });

    // Buttons & controls
    document.getElementById("btnPitchMode").addEventListener("click", () => {
      editMode = "pitch";
      document.getElementById("btnPitchMode").classList.add("active");
      document.getElementById("btnCutMode").classList.remove("active");
    });

    document.getElementById("btnCutMode").addEventListener("click", () => {
      editMode = "cut";
      document.getElementById("btnCutMode").classList.add("active");
      document.getElementById("btnPitchMode").classList.remove("active");
    });

    document.getElementById("btnReset").addEventListener("click", () => {
      segments = [{ startX: 0.06, endX: 0.96, offsetCents: 0, selected: true }];
      document.getElementById("pitchDial").dataset.val = "0";
      document.getElementById("formantDial").dataset.val = "0";
      refreshAllKnobs();
      updateHud();
      drawMainCanvas();
    });

    document.getElementById("btnTest").addEventListener("click", () => {
      const root = parseInt(rootSelect.value, 10);
      const scale = SCALES[parseInt(scaleSelect.value, 10)];
      const pitchShift = getDialValue("pitchDial");
      const count = 10;

      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const xn = 0.06 + (i / (count - 1)) * 0.9;
          playheadX = xn;
          const seg = segments[getSegAt(xn)] || segments[0];
          const rawM = getMelodyMidiAt(xn);
          const finalM = bypassed ? rawM : snapMidi(rawM + pitchShift + seg.offsetCents / 100, root, scale, 0.9);
          const inHz = 440 * Math.pow(2, (rawM - 69) / 12);
          const outHz = 440 * Math.pow(2, (finalM - 69) / 12);

          hudState.inHz = inHz;
          hudState.targetHz = outHz;
          hudState.commaC = Math.round((finalM - rawM) * 100);
          updateHud();
          playAudio(outHz, 0.24);
          drawMainCanvas();

          if (i === count - 1) {
            setTimeout(() => { playheadX = null; drawMainCanvas(); }, 280);
          }
        }, i * 220);
      }
    });

    document.getElementById("linkToggle").addEventListener("click", () => {
      linkedMode = !linkedMode;
      document.getElementById("linkLed").classList.toggle("off", !linkedMode);
    });

    document.getElementById("btnBypass").addEventListener("click", (e) => {
      bypassed = !bypassed;
      e.target.textContent = bypassed ? "Bypass" : "Active";
      e.target.classList.toggle("gold-active", !bypassed);
      drawMainCanvas();
    });

    function captureBank() {
      return {
        presetIdx: presetSelect.value,
        root: rootSelect.value,
        scale: scaleSelect.value,
        pitch: document.getElementById("pitchDial").dataset.val,
        formant: document.getElementById("formantDial").dataset.val,
        drive: document.getElementById("driveKnob").dataset.val,
        widener: document.getElementById("widenerKnob").dataset.val,
        mix: document.getElementById("mixKnob").dataset.val,
        gain: document.getElementById("gainKnob").dataset.val,
        segments: JSON.parse(JSON.stringify(segments))
      };
    }

    function restoreBank(st) {
      if (!st) return;
      presetSelect.value = st.presetIdx;
      rootSelect.value = st.root;
      scaleSelect.value = st.scale;
      document.getElementById("pitchDial").dataset.val = st.pitch;
      document.getElementById("formantDial").dataset.val = st.formant;
      document.getElementById("driveKnob").dataset.val = st.drive;
      document.getElementById("widenerKnob").dataset.val = st.widener;
      document.getElementById("mixKnob").dataset.val = st.mix;
      document.getElementById("gainKnob").dataset.val = st.gain;
      segments = JSON.parse(JSON.stringify(st.segments));
      refreshAllKnobs();
      renderPiano();
      updateHud();
      drawMainCanvas();
    }

    document.getElementById("abA").addEventListener("click", () => {
      slotStates[slotBank] = captureBank();
      slotBank = "A";
      document.getElementById("abA").classList.add("active");
      document.getElementById("abB").classList.remove("active");
      if (slotStates.A) restoreBank(slotStates.A);
    });

    document.getElementById("abB").addEventListener("click", () => {
      slotStates[slotBank] = captureBank();
      slotBank = "B";
      document.getElementById("abB").classList.add("active");
      document.getElementById("abA").classList.remove("active");
      if (slotStates.B) restoreBank(slotStates.B);
      else {
        presetSelect.value = "1";
        applyPreset(1);
      }
    });

    document.getElementById("hpRange").addEventListener("input", (e) => {
      document.getElementById("hpBadge").textContent = `HP ${e.target.value}Hz`;
    });

    document.getElementById("lpRange").addEventListener("input", (e) => {
      const v = parseInt(e.target.value, 10);
      document.getElementById("lpBadge").textContent = v >= 1000 ? `LP ${(v / 1000).toFixed(1)}k` : `LP ${v}Hz`;
    });

    presetSelect.addEventListener("change", (e) => applyPreset(parseInt(e.target.value, 10)));
    rootSelect.addEventListener("change", () => { renderPiano(); updateHud(); drawMainCanvas(); });
    scaleSelect.addEventListener("change", () => { renderPiano(); updateHud(); drawMainCanvas(); });

    setupDragDial("pitchDial", true, true, drawMainCanvas);
    setupDragDial("formantDial", true, true, drawMainCanvas);
    setupDragDial("driveKnob", false, false, drawMainCanvas);
    setupDragDial("widenerKnob", false, false, drawMainCanvas);
    setupDragDial("mixKnob", false, false, drawMainCanvas);
    setupDragDial("gainKnob", false, true, drawMainCanvas);

    window.addEventListener("resize", resizeCanvas);

    // Animate subtle light waves
    setInterval(() => {
      wavePhase += 0.055;
      drawMainCanvas();
    }, 33);

    presetSelect.value = "0";
    applyPreset(0);
    resizeCanvas();
  </script>
</body>
</html>
