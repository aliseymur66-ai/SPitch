<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPitch — Seymur Ali Vocal & Mugham Studio</title>
  <style>
    :root {
      --bg-void: #070509;
      --bg-panel: #120d18;
      --bg-card: #191221;
      --bg-input: #21182c;
      --gold-hi: #fff2be;
      --gold-main: #f5bf47;
      --gold-dim: #a97c24;
      --gold-border: rgba(245, 191, 71, 0.42);
      --cyan: #38bdf8;
      --green: #34d399;
      --text-main: #faf6ee;
      --text-muted: #cbbd9f;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1d1428 0%, var(--bg-void) 72%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 10px;
    }

    .studio-shell {
      max-width: 1280px;
      margin: 0 auto;
      background: rgba(15, 10, 21, 0.96);
      border: 1.5px solid var(--gold-border);
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75), 0 0 28px rgba(245, 191, 71, 0.08);
      overflow: hidden;
    }

    /* Header */
    .header {
      position: relative;
      background: linear-gradient(180deg, #1b1325 0%, #110c17 100%);
      border-bottom: 1px solid var(--gold-border);
      padding: 14px 18px;
      text-align: center;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .clef-badge {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(245, 191, 71, 0.12);
      border: 1px solid var(--gold-border);
      display: grid;
      place-items: center;
      color: var(--gold-hi);
      font-size: 20px;
      font-weight: 700;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--gold-hi);
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.4px;
    }

    .status-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--gold-border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .pill-btn.active {
      background: linear-gradient(135deg, var(--gold-main), #d99b1e);
      color: #140e04;
      border-color: var(--gold-hi);
    }

    .signature-block {
      margin-top: 8px;
    }

    .signature-name {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 30px;
      font-weight: 700;
      color: var(--gold-hi);
      text-shadow: 0 0 18px rgba(245, 191, 71, 0.28);
    }

    .flag-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .az-flag {
      display: inline-flex;
      flex-direction: column;
      width: 24px;
      height: 14px;
      border-radius: 2px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .az-flag span:nth-child(1) { flex: 1; background: #0092bc; }
    .az-flag span:nth-child(2) { flex: 1; background: #e4002b; }
    .az-flag span:nth-child(3) { flex: 1; background: #00af66; }

    .pro-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold-hi);
      background: rgba(245, 191, 71, 0.12);
      border: 1px solid var(--gold-border);
    }

    /* Single Clean Top Bar (Only ONE Lad selector) */
    .top-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 8px;
      padding: 10px 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--gold-border);
    }

    .ctrl-box {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: 9px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ctrl-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--gold-main);
      white-space: nowrap;
    }

    select, button.mini-btn {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid rgba(245, 191, 71, 0.35);
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    select {
      flex: 1;
      min-width: 0;
    }

    /* Main Workspace */
    .workspace {
      display: grid;
      grid-template-columns: 165px 1fr 270px;
      min-height: 430px;
    }

    /* Sidebar */
    .sidebar {
      background: #100b16;
      border-right: 1px solid var(--gold-border);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .nav-item.active,
    .nav-item:hover {
      background: rgba(245, 191, 71, 0.14);
      color: var(--gold-hi);
      border-color: var(--gold-border);
    }

    .buta-emblem {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
    }

    .mandala-ring {
      width: 66px;
      height: 66px;
      margin: 0 auto 6px;
      border-radius: 50%;
      border: 2px solid var(--gold-main);
      background: repeating-conic-gradient(
        from 0deg,
        rgba(245, 191, 71, 0.28) 0deg 15deg,
        rgba(18, 13, 24, 0.9) 15deg 30deg
      );
      display: grid;
      place-items: center;
      box-shadow: 0 0 16px rgba(245, 191, 71, 0.2);
    }

    .mandala-core {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--gold-hi);
      color: #160f04;
      font-size: 12px;
      font-weight: 900;
      display: grid;
      place-items: center;
    }

    .buta-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--gold-hi);
    }

    .buta-sub {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Center Canvas */
    .center-pane {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #0b0710;
    }

    .telemetry-strip {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px;
    }

    .canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 290px;
      background: #09060d;
      border: 1px solid var(--gold-border);
      border-radius: 10px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Right Correction Panel */
    .right-pane {
      background: var(--bg-panel);
      border-left: 1px solid var(--gold-border);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .pane-heading {
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--gold-hi);
      letter-spacing: 0.4px;
    }

    .dials-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .dial-card {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
    }

    .ring-val {
      width: 72px;
      height: 72px;
      margin: 0 auto 6px;
      border-radius: 50%;
      border: 3px solid var(--gold-main);
      background: rgba(245, 191, 71, 0.08);
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--gold-hi);
    }

    .dial-lbl {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }

      accent
